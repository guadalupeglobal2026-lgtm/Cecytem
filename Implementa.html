<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Implementa aplicaciones web · 502</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F9; --surface:#FFFFFF; --sunk:#F6F9FC; --ink:#172338; --muted:#56637A; --line:#D3DDEA; --grid:#E4EBF4;
  --datos:#12804F; --sistemas:#B4530A; --codigo:#5D3FD3; --ciudadania:#0A7584; --creacion:#B42A66; --comunicacion:#8C5E00; --integra:#3D4A63;
  --ok:#12804F; --ok-bg:#E3F4EA; --bad:#B82633; --bad-bg:#FBE7E9; --mid:#8C5E00; --mid-bg:#FFF3D6; --focus:#2563EB;
  --s1:#2D6FD6; --s2:#E08A00; --s3:#12804F; --s4:#B42A66; --s5:#5D3FD3; --s6:#0A7584;
  --cf-verde:#CDEFD9; --cf-amarillo:#FFF0B3; --cf-rojo:#F9CDD2;
  --r-sm:6px; --r:10px;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-head:"Bricolage Grotesque", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --surface:#182133; --sunk:#131B2A; --ink:#E6ECF5; --muted:#9AA8BE; --line:#2C3A52; --grid:#243048;
    --datos:#4CC48A; --sistemas:#F2A25C; --codigo:#A493FF; --ciudadania:#4BC2D1; --creacion:#F07AAE; --comunicacion:#E2B54A; --integra:#A7B4CC;
    --ok:#4CC48A; --ok-bg:#163A2A; --bad:#FF7A85; --bad-bg:#3D1A21; --mid:#E2B54A; --mid-bg:#3A2E12; --focus:#7AA7FF;
    --s1:#6EA2FF; --s2:#FFB547; --s3:#4CC48A; --s4:#F07AAE; --s5:#A493FF; --s6:#4BC2D1;
    --cf-verde:#1F5A3B; --cf-amarillo:#5A4A12; --cf-rojo:#5E2129; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#182133; --sunk:#131B2A; --ink:#E6ECF5; --muted:#9AA8BE; --line:#2C3A52; --grid:#243048;
  --datos:#4CC48A; --sistemas:#F2A25C; --codigo:#A493FF; --ciudadania:#4BC2D1; --creacion:#F07AAE; --comunicacion:#E2B54A; --integra:#A7B4CC;
  --ok:#4CC48A; --ok-bg:#163A2A; --bad:#FF7A85; --bad-bg:#3D1A21; --mid:#E2B54A; --mid-bg:#3A2E12; --focus:#7AA7FF;
  --s1:#6EA2FF; --s2:#FFB547; --s3:#4CC48A; --s4:#F07AAE; --s5:#A493FF; --s6:#4BC2D1;
  --cf-verde:#1F5A3B; --cf-amarillo:#5A4A12; --cf-rojo:#5E2129; color-scheme: dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:17px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:28px 28px;}
h1,h2,h3,h4{font-family:var(--f-head); line-height:1.15; margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.row{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin:.6rem 0}
.row.wrap{align-items:flex-end}
.grow{flex:1}

/* encabezado */
.top{display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; padding:.9rem clamp(1rem,3vw,2rem); background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5}
.brand{display:flex; gap:.8rem; align-items:center}
.logo{display:grid; place-items:center; width:46px; height:46px; border-radius:var(--r); background:var(--ink); color:var(--surface); font:800 1.25rem var(--f-head)}
.brand h1{font-size:1.25rem; font-weight:800}
.brand p{margin:0; color:var(--muted); font-size:.9rem}
.tfoot{max-width:1100px; margin:2rem auto 1rem; padding:0 1rem; text-align:right}
.tfoot #docpanel{text-align:left; margin:.6rem 0 0 auto; max-width:34rem; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:.8rem 1rem}
.docopts{border:0; padding:0; margin:.4rem 0} .docopts label{display:block; margin:.25rem 0} .docmsg{color:var(--bad)} .docmsg.okm{color:var(--ok); font-weight:700} .docok{color:var(--ok); font-weight:700}
@media print{.tfoot{display:none}}
.top-r{display:flex; gap:1rem; align-items:center; flex-wrap:wrap}
.who{display:flex; gap:.5rem; align-items:center; font-size:.9rem; color:var(--muted)}
.exp-box{display:block; margin:1rem 0; max-width:80ch} .exp-box textarea{width:100%} .exp-box textarea.need{outline:3px solid var(--bad)}
.who input.need{outline:3px solid var(--bad); outline-offset:1px}
.who.grp input{width:4.5rem}
.result .sent{margin:.4rem 0 0}
.who input{border:1px solid var(--line); background:var(--sunk); border-radius:var(--r-sm); padding:.35rem .6rem; width:13rem; max-width:50vw}
.prog-pill{display:flex; flex-direction:column; gap:.25rem; font-size:.85rem; min-width:9rem}
.pbar{display:block; height:8px; border-radius:99px; background:var(--grid); overflow:hidden}
.pbar i{display:block; height:100%; background:var(--datos); transition:width .4s}

/* estructura */
.body{display:grid; grid-template-columns:290px minmax(0,1fr); gap:0; max-width:1440px; margin:0 auto}
.side{position:sticky; top:78px; align-self:start; max-height:calc(100vh - 78px); overflow:auto; padding:1rem .8rem 2rem 1rem; border-right:1px solid var(--line); background:color-mix(in srgb,var(--bg) 85%,transparent)}
.side-home{display:block; padding:.45rem .6rem; border-radius:var(--r-sm); text-decoration:none; font-weight:700; margin-bottom:.4rem}
.side-home.on,.side a.on{background:var(--surface); box-shadow:inset 3px 0 0 var(--hc,var(--ink))}
.side-m{margin:.8rem 0}
.side-m h2{font-size:.95rem; display:flex; gap:.45rem; align-items:center; margin:0 0 .25rem .2rem}
.side ul{list-style:none; margin:0; padding:0}
.side li a{display:flex; gap:.5rem; padding:.32rem .6rem; border-radius:var(--r-sm); text-decoration:none; font-size:.92rem; color:var(--muted)}
.side li a:hover{background:var(--surface); color:var(--ink)}
.side li a.st-hecho,.side li a.st-dominado{color:var(--ink)}
.side .ic{width:1rem; flex:none; color:var(--hc)}
.mcol{display:inline-grid; place-items:center; min-width:1.6rem; height:1.6rem; padding:0 .3rem; border-radius:5px; background:var(--hc,var(--ink)); color:#fff; font:700 .8rem var(--f-mono)}
main{padding:1.4rem clamp(1rem,3vw,2.4rem) 4rem; min-width:0; outline:none}

/* inicio: mapa de prácticas como hoja */
.hero{max-width:62ch; margin-bottom:1.4rem}
.hero h2{font-size:clamp(1.8rem,4vw,2.6rem); font-weight:800; letter-spacing:-.01em}
.hero p{color:var(--muted); margin:.5rem 0 0}
.pmap-wrap{overflow-x:auto; padding-bottom:.4rem}
.pmap{display:grid; grid-template-columns:repeat(var(--n),minmax(150px,1fr)); border:1px solid var(--line); border-radius:var(--r); background:var(--surface); min-width:calc(var(--n) * 150px)}
.mcolumn{border-right:1px solid var(--line); display:flex; flex-direction:column}
.mcolumn:last-child{border-right:0}
.mhead{padding:.7rem .7rem .6rem; border-bottom:3px solid var(--hc); min-height:6.2rem; display:flex; flex-direction:column; gap:.3rem}
.mname{font:700 .98rem/1.2 var(--f-head)}
.mhilo{font-size:.78rem; color:var(--muted)}
.pcell{display:flex; flex-direction:column; gap:.2rem; padding:.6rem .7rem; min-height:6.4rem; border-bottom:1px solid var(--line); text-decoration:none; position:relative; transition:background .15s}
.pcell:last-child{border-bottom:0}
.pcell.empty{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--grid) 8px 9px)}
a.pcell:hover{background:var(--sunk)}
.pref{font:600 .78rem var(--f-mono); color:var(--muted)}
.pname{font-weight:700; line-height:1.25}
.pst{margin-top:auto; font-size:.8rem; color:var(--muted)}
.pcell.st-hecho,.pcell.st-dominado{background:color-mix(in srgb,var(--hc) 14%,var(--surface))}
.pcell.st-hecho .pst,.pcell.st-dominado .pst{color:var(--hc); font-weight:700}
.pcell.st-intentado{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--hc) 45%,transparent)}
.legend{display:flex; gap:1.2rem; flex-wrap:wrap; color:var(--muted); font-size:.88rem}

/* práctica */
.prac{max-width:980px}
.back{display:none; text-decoration:none; color:var(--muted); margin-bottom:.6rem}
.crumb{display:flex; gap:.5rem; align-items:center; color:var(--muted); margin:0 0 .4rem; font-size:.95rem}
.prac h2{font-size:clamp(1.6rem,3.4vw,2.2rem); font-weight:800}
.intro{max-width:70ch; margin:.6rem 0 1rem}
.tip{background:var(--surface); border:1px dashed var(--line); border-radius:var(--r); padding:.5rem .9rem; margin-bottom:1rem; max-width:75ch}
.tip summary{cursor:pointer; font-weight:700}
.engine{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:clamp(.9rem,2.4vw,1.5rem); border-top:4px solid var(--hc)}
.lead-card{background:var(--sunk); border-left:4px solid var(--hc); padding:.7rem 1rem; border-radius:0 var(--r-sm) var(--r-sm) 0; margin-bottom:1rem; max-width:80ch}
.lead-card p{margin:.3rem 0}
.sub{font-size:1.1rem; margin:1.4rem 0 .6rem}
.result{margin:1rem 0 .4rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap}
.res{display:flex; gap:.8rem; align-items:center; padding:.6rem 1rem; border-radius:var(--r); flex:1; min-width:260px}
.res b{font:800 1.5rem var(--f-head)}
.res-ok{background:var(--ok-bg); color:var(--ok)} .res-mid{background:var(--mid-bg); color:var(--mid)} .res-bad{background:var(--bad-bg); color:var(--bad)}
.res span{color:var(--ink)}
.foot{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-top:.8rem}
.btn{display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--line); background:var(--surface); padding:.55rem 1rem; border-radius:var(--r-sm); cursor:pointer; text-decoration:none; font-weight:700; min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px; padding:.35rem .7rem; font-size:.9rem}
.btn:disabled{opacity:.5; cursor:not-allowed}
.mini{border:1px solid var(--line); background:var(--surface); border-radius:5px; min-width:28px; height:28px; cursor:pointer; padding:0 .4rem; font-weight:700}
.mini.txt{font-weight:400; font-size:.82rem}
.mini.x{color:var(--bad)}

/* clasificar / quiz */
.cls{display:flex; flex-direction:column; gap:.7rem}
.cls-item{border:1px solid var(--line); border-radius:var(--r); padding:.7rem .9rem; background:var(--surface)}
.cls-text{margin-bottom:.5rem}
.cls-text code{font:600 1.05rem var(--f-mono)}
.seg{display:flex; flex-wrap:wrap; gap:.4rem}
.seg button{border:1px solid var(--line); background:var(--sunk); border-radius:99px; padding:.4rem .85rem; cursor:pointer; min-height:40px}
.seg button[aria-pressed="true"]{background:var(--hc,var(--ink)); color:#fff; border-color:transparent}
.cls-fb,.q-fb{font-size:.9rem; margin-top:.35rem}
.ok>.cls-fb,.ok .q-fb{color:var(--ok)} .bad>.cls-fb,.bad .q-fb{color:var(--bad)}
.cls-item.ok,.q.ok,.tr.ok,.ord-set.ok{border-color:var(--ok); box-shadow:inset 4px 0 0 var(--ok)}
.cls-item.bad,.q.bad,.tr.bad,.ord-set.bad{border-color:var(--bad); box-shadow:inset 4px 0 0 var(--bad)}
.q{border:1px solid var(--line); border-radius:var(--r); padding:.7rem 1rem; margin:0 0 .8rem}
.q legend{font-weight:700; padding:0 .3rem}
.q-art{margin:.4rem 0 .6rem}
.opt{display:flex; gap:.6rem; align-items:flex-start; padding:.35rem .2rem; cursor:pointer}
.opt input{margin-top:.35rem; width:18px; height:18px; flex:none}
.toc{margin-top:1rem; border:1px solid var(--line); border-radius:var(--r); padding:.8rem 1rem; background:var(--sunk)}
.toc-body{margin-top:.4rem}
.toc-l1{font-weight:700} .toc-l2{padding-left:1.4rem}

/* señales */
.spot-frame{border:1px solid var(--line); border-radius:var(--r); margin-bottom:1rem; overflow:hidden}
.spot-head{background:var(--sunk); padding:.6rem 1rem; border-bottom:1px solid var(--line); font-size:.92rem}
.spot-body{padding:.9rem 1rem; line-height:2}
.frame-chat .spot-body{background:var(--sunk)}
.frame-news .spot-head{font:800 1.15rem var(--f-head)}
.spot{border:0; background:transparent; padding:.05rem .15rem; border-radius:4px; cursor:pointer; text-decoration:underline dotted color-mix(in srgb,var(--muted) 60%,transparent); text-underline-offset:4px; line-height:1.5}
.spot:hover{background:var(--grid)}
.spot[aria-pressed="true"]{background:var(--mid-bg); outline:2px solid var(--mid); text-decoration:none}
.spot.ok{background:var(--ok-bg); outline-color:var(--ok)} .spot.bad{background:var(--bad-bg); outline-color:var(--bad)}
.spot-why{display:inline-block; font-size:.8rem; background:var(--ok); color:#fff; border-radius:4px; padding:0 .4rem; margin:0 .3rem; line-height:1.6}

/* ordenar */
.ord-set{border:1px solid var(--line); border-radius:var(--r); padding:.7rem 1rem; margin-bottom:1rem}
.ord-prompt{margin:0 0 .5rem; font-weight:700}
.ord{margin:0; padding-left:1.6rem}
.ord li{display:flex; align-items:center; gap:.6rem; justify-content:space-between; padding:.4rem .5rem; border:1px solid var(--line); border-radius:var(--r-sm); margin:.35rem 0; background:var(--surface)}
.ord li::marker{font-weight:700}
.ord-btns{display:flex; gap:.25rem; flex:none}
.ord-btns button{width:36px; height:36px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--sunk); cursor:pointer}
.ord-wrap.with-prev{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,300px); gap:1rem; align-items:start}
.layer-prev svg{width:100%; border:1px solid var(--line); border-radius:var(--r-sm); background:repeating-conic-gradient(var(--grid) 0 25%,var(--surface) 0 50%) 0 0/16px 16px}

/* reglas / medidor */
.rules{list-style:none; padding:0; margin:.5rem 0}
.rules li{padding:.2rem 0 .2rem 1.6rem; position:relative}
.rules li::before{content:"○"; position:absolute; left:.2rem; color:var(--muted)}
.rules li.on::before{content:"✓"; color:var(--ok); font-weight:700}
.rules li.on{color:var(--ink)}
.fld{display:flex; flex-direction:column; gap:.3rem; margin:.6rem 0}
.fld>span{font-weight:700; font-size:.95rem}
.fld input[type=text],.fld textarea,.pw,.tr-in,.sm-in,select{border:1px solid var(--line); background:var(--sunk); border-radius:var(--r-sm); padding:.5rem .7rem; max-width:100%}
.fld textarea{resize:vertical; min-height:4.5rem}
.fld.ok textarea,.fld.ok input{border-color:var(--ok)}
.pw{font:600 1.1rem var(--f-mono)}
.meter{height:12px; background:var(--grid); border-radius:99px; overflow:hidden; margin-top:.5rem}
.meter-bar{height:100%; width:0; transition:width .25s; background:var(--bad)}
.meter-bar[data-lv="mid"]{background:var(--mid)} .meter-bar[data-lv="high"]{background:var(--ok)}
.meter-t{font-weight:700; margin:.3rem 0}
.rw{border:1px solid var(--line); border-radius:var(--r); padding:.8rem 1rem; margin-bottom:1rem}
.bubble{display:inline-block; padding:.5rem .9rem; border-radius:14px 14px 14px 4px; background:var(--bad-bg); max-width:60ch}
.chk{display:flex; gap:.5rem; align-items:center}

/* composición / foto / audio */
.thirds{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr); gap:1.2rem; align-items:start}
.th-svg{width:100%; border-radius:var(--r-sm); touch-action:none; user-select:none; display:block}
.th-g{stroke:#fff; stroke-width:1.5; stroke-dasharray:6 5; opacity:.9}
.th-dot{fill:#fff; stroke:#172338; stroke-width:1.5}
input[type=range]{width:100%; accent-color:var(--hc,var(--ink)); min-height:32px}
.ph-row{display:grid; grid-template-columns:1fr 1fr; gap:1rem}
.ph-row figure{margin:0} .ph{width:100%; border-radius:var(--r-sm); display:block}
.ph-row figcaption{text-align:center; color:var(--muted); font-size:.9rem; margin-top:.3rem}
.ctl-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0 1.2rem; margin-top:.6rem}
.mixer{display:flex; flex-direction:column; gap:.6rem}
.trk{display:grid; grid-template-columns:8rem 1fr; align-items:center; gap:.8rem}
.trk-n{font-weight:700}
.wave{display:flex; align-items:center; gap:2px; height:56px; background:var(--sunk); border-radius:var(--r-sm); padding:0 6px}
.wave i{flex:1; background:var(--hc); border-radius:2px; height:calc(var(--h) * var(--lv,.5) * 100%); min-height:2px}
.mix-t{font-weight:700}

/* robot */
.lv-tabs{display:flex; gap:.4rem; margin-bottom:.6rem; flex-wrap:wrap}
.lv-tabs button{border:1px solid var(--line); background:var(--sunk); border-radius:var(--r-sm); padding:.35rem .8rem; cursor:pointer}
.lv-tabs button[aria-selected="true"]{background:var(--hc); color:#fff; border-color:transparent}
.lv-goal{margin:.2rem 0 .8rem}
.rb-wrap{display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,1fr); gap:1.2rem; align-items:start}
.rb-svg{width:100%; display:block}
.rb-cell{fill:var(--sunk); stroke:var(--line)} .rb-wall{fill:var(--integra); stroke:var(--line)}
.rb-pal{display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.6rem}
.pal{border:0; color:#fff; border-radius:var(--r-sm); padding:.45rem .8rem; cursor:pointer; font-weight:700; min-height:40px}
.k-avanzar.pal{background:var(--s1)} .k-izq.pal,.k-der.pal{background:var(--codigo)} .k-rep.pal{background:var(--s2); color:#1a1205}
.rb-head{font-weight:700; background:var(--s3); color:#fff; padding:.35rem .7rem; border-radius:var(--r-sm) var(--r-sm) 0 0; display:flex; gap:.5rem; align-items:center; flex-wrap:wrap}
.rb-head .muted{color:#e6fff0}
.rb-prog{list-style:none; margin:0; padding:.3rem 0 .3rem .5rem; border-left:4px solid var(--s3)}
.rb-prog.nested{border-left-color:var(--s2); margin-left:.6rem}
.rb-b{margin:.25rem 0; padding:.3rem .5rem; border-radius:var(--r-sm); background:var(--sunk); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.3rem}
.rb-b>ul{flex-basis:100%}
.rb-b.k-avanzar{box-shadow:inset 4px 0 0 var(--s1)} .rb-b.k-izq,.rb-b.k-der{box-shadow:inset 4px 0 0 var(--codigo)} .rb-b.k-rep{box-shadow:inset 4px 0 0 var(--s2)}
.rb-b.dest{outline:2px dashed var(--s2)}
.rb-msg.ok{color:var(--ok); font-weight:700} .rb-msg.bad{color:var(--bad); font-weight:700}
.rb-empty{padding:.5rem}

/* código */
.code{font:14px/1.6 var(--f-mono); background:#16202F; color:#E6ECF5; padding:.8rem 1rem; border-radius:var(--r-sm); overflow:auto; margin:0 0 .6rem}
.code .ln{display:inline-block; width:1.8rem; color:#6B7A93; user-select:none}
.tr{border:1px solid var(--line); border-radius:var(--r); padding:.8rem; margin-bottom:1rem}
.tr-q p{margin:.2rem 0 .4rem}
.ed{display:grid; grid-template-columns:1fr 1fr; gap:1rem}
.ed textarea{font:14px/1.55 var(--f-mono); min-height:340px; white-space:pre; tab-size:2}
.ed-prev{display:flex; flex-direction:column; gap:.3rem; margin:.6rem 0}
.ed-prev iframe{flex:1; min-height:340px; border:1px solid var(--line); border-radius:var(--r-sm); background:#fff}

/* dados / contraste */
.tbl-wrap{overflow-x:auto}
.freq{border-collapse:collapse; margin:.6rem 0; font-variant-numeric:tabular-nums}
.freq th,.freq td{border:1px solid var(--line); padding:.3rem .6rem; text-align:center}
.freq th{background:var(--sunk)}
.chart{width:100%; max-width:560px; display:block; margin:.6rem 0}

.fx{font:italic 700 .95rem var(--f-body); color:var(--muted)}
.finput{flex:1; min-width:0; font:15px var(--f-mono); border:1px solid var(--line); border-radius:4px; padding:.4rem .6rem; background:var(--surface)}
.valpick{padding:.4rem .7rem; border-bottom:1px solid var(--line); background:var(--mid-bg)}
.gridwrap{overflow:auto; max-height:460px}
.grid{border-collapse:separate; border-spacing:0; font-variant-numeric:tabular-nums; outline:none; font-size:.93rem}
.grid th{position:sticky; top:0; background:var(--sunk); color:var(--muted); font:600 .8rem var(--f-mono); padding:.25rem .5rem; border-right:1px solid var(--line); border-bottom:1px solid var(--line); z-index:1}

.grid td{min-width:92px; max-width:220px; height:32px; padding:.2rem .5rem; border-right:1px solid var(--grid); border-bottom:1px solid var(--grid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:cell; background:var(--surface)}
.grid td.num{text-align:right} .grid td.b{font-weight:700; background:var(--sunk)} .grid td.err{color:var(--bad); font-weight:700}
.grid td.f{color:color-mix(in srgb,var(--ink) 88%,var(--datos))}

.grid td[data-cf="verde"]{background-color:var(--cf-verde)} .grid td[data-cf="amarillo"]{background-color:var(--cf-amarillo)} .grid td[data-cf="rojo"]{background-color:var(--cf-rojo)}
.grid td.sel{outline:2px solid var(--datos); outline-offset:-2px; position:relative}
.toolbar{display:flex; gap:.4rem; flex-wrap:wrap; padding:.5rem .6rem; border-top:1px solid var(--line); background:var(--sunk)}
.toolpanel{padding:.6rem .8rem; border-top:1px solid var(--line)}
.toolpanel p{margin:.2rem 0 .4rem}
.toolpanel label{display:flex; flex-direction:column; gap:.2rem; font-size:.88rem}
.sm-in{width:5rem; padding:.3rem .5rem} .w6{width:6rem} .w8{width:8rem} .w12{width:12rem} .w16{width:16rem}
.rulelist{margin:.4rem 0 0; padding-left:1.2rem; font-size:.9rem}
.outputs{display:flex; flex-wrap:wrap; gap:1rem; padding:0 .8rem}
.out-card{border:1px solid var(--line); border-radius:var(--r); padding:.6rem .8rem; margin:.8rem 0; background:var(--surface); flex:1 1 320px; max-width:600px}

.pivot{border-collapse:collapse; margin-top:.4rem; font-variant-numeric:tabular-nums}
.pivot th,.pivot td{border:1px solid var(--line); padding:.3rem .7rem} .pivot th{background:var(--sunk)} .pivot td.num{text-align:right} .pivot tr.tot td{font-weight:700}
.xl-flash{background:var(--bad-bg); color:var(--bad); padding:.4rem .7rem; margin:0; font-weight:700}
.hoja-info{background:var(--sunk); border-left:4px solid var(--hc); border-radius:0 var(--r-sm) var(--r-sm) 0; padding:.6rem 1rem; margin:0 0 1rem; max-width:80ch}
.hoja-info summary{font-weight:700; cursor:pointer}
.hoja-info p{margin:.45rem 0} .hoja-info ul{margin:.2rem 0 .4rem; padding-left:1.3rem} .hoja-info li{margin:.15rem 0}
.hoja-info .hi-l{font-weight:700; margin-bottom:.1rem} .hoja-info .hi-n{font-size:.9em; color:var(--muted)}
.tasks .tk-why{display:block; font-size:.88em; color:var(--muted); margin-top:.15rem}
.tasks .tk-how{margin:.2rem 0 .1rem; font-size:.9em}
.tasks .tk-how summary{cursor:pointer; color:var(--hc); font-weight:600; width:max-content; max-width:100%}

.tasks .tk-how li::marker{content:counter(list-item) ". "; color:var(--muted)}

.sol-l{padding-left:1.4rem; margin:.4rem 0} .sol-l li{margin:.35rem 0}

.sol-rb{margin:.2rem 0 .5rem; padding-left:1.3rem} .sol-rb li{margin:.15rem 0}

.sol-box pre.code{white-space:pre-wrap; overflow-x:auto}
/* ---- logros, arrastrar y soltar, repaso relámpago ---- */
.xpbtn{display:inline-flex; gap:.3rem; align-items:center; text-decoration:none; color:var(--ink); background:var(--sunk); border:1px solid var(--line); border-radius:999px; padding:.3rem .75rem; font-size:.85rem; white-space:nowrap}
.xpbtn:hover{border-color:var(--s1)}
#toasts{position:fixed; right:1rem; bottom:1rem; display:flex; flex-direction:column; gap:.5rem; z-index:60}
.toast{background:var(--surface); color:var(--ink); border:2px solid var(--s2); border-radius:12px; padding:.65rem 1rem; box-shadow:0 8px 24px rgba(0,0,0,.18); animation:tin .35s ease-out; max-width:22rem}
.toast.out{opacity:0; transform:translateY(8px); transition:.5s}

canvas.confetti{position:fixed; inset:0; pointer-events:none; z-index:70}
.logros .lvl{display:flex; gap:1rem; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:1rem 1.2rem; margin:1rem 0}

.bdgs{list-style:none; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(11rem,1fr)); gap:.7rem}
.bdg{border:1px solid var(--line); border-radius:var(--r); padding:.7rem; background:var(--sunk); display:flex; flex-direction:column; gap:.2rem; opacity:.6}

.bdg:not(.on) .bdg-i.letter{background:var(--line)} .bdg-d{color:var(--ok)}
.rapids{list-style:none; padding:0} .rapids li{display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; padding:.45rem 0; border-bottom:1px solid var(--line)}
.mrapid{display:inline-block; margin-top:.35rem; font-size:.75rem; font-weight:700; color:var(--hc); text-decoration:none}
.rapid{max-width:46rem} .r-top{display:flex; justify-content:space-between; font-size:1.1rem; margin:.5rem 0}
.r-bar{height:.6rem; background:var(--sunk); border-radius:999px; overflow:hidden} .r-bar i{display:block; height:100%; width:100%; background:var(--hc); transition:width .2s linear}

.r-opts{display:grid; gap:.5rem} .r-opt{display:flex; gap:.7rem; align-items:center; text-align:left; padding:.75rem 1rem; border:2px solid var(--line); border-radius:var(--r); background:var(--surface); color:var(--ink); font:inherit; cursor:pointer}
.r-opt:hover{border-color:var(--hc)} .r-opt.ok{border-color:var(--ok); background:color-mix(in srgb,var(--ok) 14%,var(--surface))} .r-opt.bad{border-color:var(--bad); background:color-mix(in srgb,var(--bad) 12%,var(--surface)); animation:shake .3s}
.r-n{display:inline-grid; place-items:center; width:1.6rem; height:1.6rem; border-radius:50%; background:var(--sunk); font-weight:700; flex:none}
.r-fb{min-height:1.5rem; font-weight:600} .r-final{font-size:1.5rem}
@keyframes shake{25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}}
.grip{cursor:grab; color:var(--muted); font-size:1.1rem; padding:0 .45rem 0 0; touch-action:none; user-select:none}
.ord li{cursor:grab} .ord li.dragging,.cls-item.dragging{opacity:.55; outline:2px dashed var(--s1)}
.cls-text{cursor:grab; user-select:none}
.cls-ghost{position:fixed; z-index:80; pointer-events:none; background:var(--surface); border:2px solid var(--s1); border-radius:10px; padding:.4rem .7rem; box-shadow:0 8px 20px rgba(0,0,0,.2); max-width:18rem; font-size:.9rem}
.cls-drop{position:fixed; left:0; right:0; bottom:0; z-index:75; background:color-mix(in srgb,var(--surface) 94%,transparent); border-top:2px solid var(--s1); padding:.6rem 1rem 1rem; box-shadow:0 -6px 20px rgba(0,0,0,.15)}
.cls-drop p{margin:0 0 .4rem; font-weight:700; text-align:center} .cls-drop>div{display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap}
.dz{min-width:8rem; text-align:center; padding:1rem .9rem; border:2px dashed var(--s1); border-radius:12px; font-weight:700; background:var(--sunk)}
.dz.over{background:var(--s1); color:#fff; border-style:solid}
.fails{margin:.7rem 0 0; padding:.6rem .9rem; border:1px solid var(--bad); border-left-width:4px; border-radius:var(--r-sm); background:color-mix(in srgb,var(--bad) 6%,var(--surface)); max-width:80ch}
.fails p{margin:0 0 .3rem} .fails ol{margin:.2rem 0; padding-left:1.4rem} .fails li{margin:.25rem 0}
.lnk{background:none; border:0; padding:0; font:inherit; color:var(--ink); text-decoration:underline; text-decoration-color:var(--bad); cursor:pointer; text-align:left}
.ord li.ok{border-color:var(--ok); box-shadow:inset 4px 0 0 var(--ok)} .ord li.bad{border-color:var(--bad); box-shadow:inset 4px 0 0 var(--bad)}
.flash{animation:flash 1.2s ease-out} @keyframes flash{0%,40%{outline:4px solid var(--s2); outline-offset:3px} 100%{outline:0 solid transparent}}
.th-goal{stroke:#12804F; stroke-width:4; stroke-dasharray:10 6} .th-goalc{fill:rgba(18,128,79,.15); stroke:#12804F; stroke-width:3; stroke-dasharray:6 4}
.th-arrow{stroke:#12804F; stroke-width:3; fill:none} .th-lbl{fill:#fff; font:700 18px system-ui,sans-serif; paint-order:stroke; stroke:#12804F; stroke-width:5px}

.th-ex{width:100%; max-width:420px; border-radius:var(--r-sm); display:block; margin:.4rem 0}
.tasks{padding-left:1.4rem}
.tasks li{margin:.35rem 0; padding:.2rem .4rem}
.tasks li.ok{color:var(--ok)} .tasks li.ok::marker{content:"✓ "; color:var(--ok)}

.tasks code,.intro code,.lead-card code,.tip code{font:600 .9em var(--f-mono); background:var(--sunk); padding:0 .25rem; border-radius:4px}


/* ejercicios por tema */

/* constancia */
#print{display:none}
body.show-cert #print{display:block; position:fixed; inset:0; background:var(--bg); z-index:20; overflow:auto; padding:2rem}

}

<div id="app"></div>
<script>
/* ===== Motor de fórmulas (Excel en español, con alias en inglés) ===== */
const FX = (() => {
  const ERR = (code) => ({ err: code });
  const isErr = (v) => v && typeof v === 'object' && 'err' in v;

  function colToNum(c) { let n = 0; for (const ch of c) n = n * 26 + (ch.charCodeAt(0) - 64); return n; }
  function numToCol(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  function parseAddr(a) {
    const m = /^\$?([A-Z]{1,2})\$?(\d+)$/.exec(String(a).toUpperCase().trim());
    if (!m) return null; return { c: colToNum(m[1]), r: parseInt(m[2], 10) };
  }
  function addr(c, r) { return numToCol(c) + r; }
  function parseRange(s) {
    s = String(s).toUpperCase().replace(/\$/g, '').trim();
    const p = s.split(':');
    const a = parseAddr(p[0]); const b = p[1] ? parseAddr(p[1]) : a;
    if (!a || !b) return null;
    return { c1: Math.min(a.c, b.c), r1: Math.min(a.r, b.r), c2: Math.max(a.c, b.c), r2: Math.max(a.r, b.r) };
  }
  function rangeCells(s) {
    const g = parseRange(s); if (!g) return [];

  /* ---------- tokenizador ---------- */
  function tokenize(src) {
    const t = []; let i = 0;
    const isL = (ch) => /[A-Za-zÁÉÍÓÚÑáéíóúñ_]/.test(ch);
    while (i < src.length) {
      const ch = src[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (ch === '"') { let j = i + 1, s = ''; while (j < src.length) { if (src[j] === '"') { if (src[j + 1] === '"') { s += '"'; j += 2; continue; } break; } s += src[j++]; } if (j >= src.length) throw new Error('comillas'); t.push({ k: 'str', v: s }); i = j + 1; continue; }
      if (/[0-9.]/.test(ch)) { const m = /^[0-9]*\.?[0-9]+([eE][-+]?[0-9]+)?/.exec(src.slice(i)) || /^[0-9]+\.?/.exec(src.slice(i)); t.push({ k: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
      if (ch === '$' || isL(ch)) {
        const rest = src.slice(i);
        const rr = /^(\$?[A-Za-z]{1,2}\$?\d+)(:\$?[A-Za-z]{1,2}\$?\d+)?/.exec(rest);
        const fm = /^[A-Za-zÁÉÍÓÚÑáéíóúñ_][A-Za-zÁÉÍÓÚÑáéíóúñ_0-9.]*\s*\(/.exec(rest);
        if (fm && (!rr || fm[0].length > rr[0].length)) { t.push({ k: 'fn', v: fm[0].replace(/[\s(]/g, '').toUpperCase() }); i += fm[0].length; continue; }
        if (rr && !/[A-Za-z(]/.test(rest[rr[0].length] || '')) { t.push({ k: rr[2] ? 'range' : 'ref', v: rr[0].toUpperCase() }); i += rr[0].length; continue; }
        const wm = /^[A-Za-zÁÉÍÓÚÑáéíóúñ_][A-Za-zÁÉÍÓÚÑáéíóúñ_0-9.]*/.exec(rest);
        const w = wm[0].toUpperCase();
        if (['VERDADERO', 'TRUE'].includes(w)) t.push({ k: 'bool', v: true });
        else if (['FALSO', 'FALSE'].includes(w)) t.push({ k: 'bool', v: false });
        else t.push({ k: 'name', v: w });
        i += wm[0].length; continue;
      }
      const two = src.slice(i, i + 2);
      if (['<>', '<=', '>='].includes(two)) { t.push({ k: 'op', v: two }); i += 2; continue; }
      if ('+-*/^&=<>(),;:%'.includes(ch)) { t.push({ k: 'op', v: ch }); i++; continue; }
      throw new Error('símbolo ' + ch);
    }
    return t;
  }

  /* ---------- analizador ---------- */
  function parse(src) {
    const t = tokenize(src); let p = 0;
    const peek = () => t[p]; const next = () => t[p++];
    const isOp = (v) => peek() && peek().k === 'op' && peek().v === v;
    function cmp() { let l = cat(); while (peek() && peek().k === 'op' && ['=', '<>', '<', '>', '<=', '>='].includes(peek().v)) { const o = next().v; l = { k: 'bin', o, l, r: cat() }; } return l; }
    function cat() { let l = add(); while (isOp('&')) { next(); l = { k: 'bin', o: '&', l, r: add() }; } return l; }
    function add() { let l = mul(); while (isOp('+') || isOp('-')) { const o = next().v; l = { k: 'bin', o, l, r: mul() }; } return l; }
    function mul() { let l = pow(); while (isOp('*') || isOp('/')) { const o = next().v; l = { k: 'bin', o, l, r: pow() }; } return l; }
    function pow() { let l = un(); while (isOp('^')) { next(); l = { k: 'bin', o: '^', l, r: un() }; } return l; }
    function un() { if (isOp('-')) { next(); return { k: 'neg', e: un() }; } if (isOp('+')) { next(); return un(); } let e = prim(); while (isOp('%')) { next(); e = { k: 'bin', o: '/', l: e, r: { k: 'num', v: 100 } }; } return e; }
    function prim() {
      const tk = next(); if (!tk) throw new Error('fin');
      if (tk.k === 'num') return { k: 'num', v: tk.v };
      if (tk.k === 'str') return { k: 'str', v: tk.v };
      if (tk.k === 'bool') return { k: 'bool', v: tk.v };
      if (tk.k === 'ref') return { k: 'ref', a: tk.v.replace(/\$/g, '') };
      if (tk.k === 'range') return { k: 'range', a: tk.v.replace(/\$/g, '') };
      if (tk.k === 'name') return { k: 'name', v: tk.v };

        const args = [];

  }

  const flat = (v) => (v && v.rows) ? v.rows.flat() : [v];
  const toNum = (v) => { if (isErr(v)) return v; if (v === null || v === undefined || v === '') return 0; if (typeof v === 'boolean') return v ? 1 : 0; if (typeof v === 'number') return v; const n = Number(String(v).replace(',', '.')); return isNaN(n) ? ERR('#¡VALOR!') : n; };

    };
  }
  const truthy = (v) => { if (typeof v === 'boolean') return v; if (typeof v === 'number') return v !== 0; if (typeof v === 'string') { const n = norm(v); if (n === 'verdadero' || n === 'true') return true; if (n === 'falso' || n === 'false') return false; return ERR('#¡VALOR!'); } return false; };

  const F = {
    SUMA: (a) => { const n = nums(a); return isErr(n) ? n : n.reduce((s, x) => s + x, 0); },
    PROMEDIO: (a) => { const n = nums(a); if (isErr(n)) return n; return n.length ? n.reduce((s, x) => s + x, 0) / n.length : ERR('#¡DIV/0!'); },
    MAX: (a) => { const n = nums(a); return isErr(n) ? n : (n.length ? Math.max(...n) : 0); },
    MIN: (a) => { const n = nums(a); return isErr(n) ? n : (n.length ? Math.min(...n) : 0); },
    CONTAR: (a) => a.reduce((s, x) => s + flat(x).filter((v) => typeof v === 'number').length, 0),
    CONTARA: (a) => a.reduce((s, x) => s + flat(x).filter((v) => v !== null && v !== undefined && v !== '').length, 0),
    'CONTAR.BLANCO': (a) => a.reduce((s, x) => s + flat(x).filter((v) => v === null || v === undefined || v === '').length, 0),
    'CONTAR.SI': (a) => { if (a.length < 2) return ERR('#¡VALOR!'); const f = crit(a[1]); return flat(a[0]).filter(f).length; },
    'SUMAR.SI': (a) => { if (a.length < 2) return ERR('#¡VALOR!'); const f = crit(a[1]); const r = flat(a[0]); const s = a[2] ? flat(a[2]) : r; let t = 0; r.forEach((x, i) => { if (f(x) && typeof s[i] === 'number') t += s[i]; }); return t; },
    'PROMEDIO.SI': (a) => { if (a.length < 2) return ERR('#¡VALOR!'); const f = crit(a[1]); const r = flat(a[0]); const s = a[2] ? flat(a[2]) : r; let t = 0, n = 0; r.forEach((x, i) => { if (f(x) && typeof s[i] === 'number') { t += s[i]; n++; } }); return n ? t / n : ERR('#¡DIV/0!'); },
    SI: (a) => { const c = truthy(a[0]); if (isErr(c)) return c; return c ? (a.length > 1 ? a[1] : true) : (a.length > 2 ? a[2] : false); },
    Y: (a) => { let r = true; for (const x of a) for (const v of flat(x)) { const b = truthy(v); if (isErr(b)) return b; r = r && b; } return r; },
    O: (a) => { let r = false; for (const x of a) for (const v of flat(x)) { const b = truthy(v); if (isErr(b)) return b; r = r || b; } return r; },
    NO: (a) => { const b = truthy(a[0]); return isErr(b) ? b : !b; },
    BUSCARV: (a) => {
      const v = a[0], tab = a[1], col = toNum(a[2]); if (!tab || !tab.rows) return ERR('#¡VALOR!');

    },
    MEDIANA: (a) => { const n = nums(a); if (isErr(n)) return n; if (!n.length) return ERR('#¡NUM!'); const s = [...n].sort((x, y) => x - y); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; },
    MODA: (a) => { const n = nums(a); if (isErr(n)) return n; const c = new Map(); let best = null, bc = 1; for (const x of n) { const k = (c.get(x) || 0) + 1; c.set(x, k); if (k > bc) { bc = k; best = x; } } return best === null ? ERR('#N/A') : best; },
    REDONDEAR: (a) => { const x = toNum(a[0]), d = toNum(a[1] ?? 0); if (isErr(x)) return x; const f = Math.pow(10, d); return Math.round((x + Math.sign(x) * 1e-12) * f) / f; },
    ENTERO: (a) => { const x = toNum(a[0]); return isErr(x) ? x : Math.floor(x); },
    ABS: (a) => { const x = toNum(a[0]); return isErr(x) ? x : Math.abs(x); },
    POTENCIA: (a) => { const x = toNum(a[0]), y = toNum(a[1]); return isErr(x) ? x : isErr(y) ? y : Math.pow(x, y); },
    RAIZ: (a) => { const x = toNum(a[0]); if (isErr(x)) return x; return x < 0 ? ERR('#¡NUM!') : Math.sqrt(x); },
    'ALEATORIO.ENTRE': (a) => { const x = toNum(a[0]), y = toNum(a[1]); if (isErr(x)) return x; if (isErr(y)) return y; return Math.floor(Math.random() * (y - x + 1)) + x; },
    CONCATENAR: (a) => a.map((x) => flat(x).map(txt).join('')).join(''),
    MAYUSC: (a) => txt(a[0]).toUpperCase(),
    MINUSC: (a) => txt(a[0]).toLowerCase(),
    LARGO: (a) => txt(a[0]).length,
  };
  const alias = { SUM: 'SUMA', AVERAGE: 'PROMEDIO', COUNT: 'CONTAR', COUNTA: 'CONTARA', COUNTIF: 'CONTAR.SI', SUMIF: 'SUMAR.SI', AVERAGEIF: 'PROMEDIO.SI', IF: 'SI', AND: 'Y', OR: 'O', NOT: 'NO', VLOOKUP: 'BUSCARV', MEDIAN: 'MEDIANA', MODE: 'MODA', 'MODA.UNO': 'MODA', 'MODE.SNGL': 'MODA', ROUND: 'REDONDEAR', INT: 'ENTERO', POWER: 'POTENCIA', SQRT: 'RAIZ', RANDBETWEEN: 'ALEATORIO.ENTRE', CONCAT: 'CONCATENAR', CONCATENATE: 'CONCATENAR', UPPER: 'MAYUSC', LOWER: 'MINUSC', LEN: 'LARGO', COUNTBLANK: 'CONTAR.BLANCO', 'PROMEDIO.SI.CONJUNTO': null };
  function txt(v) { if (v === null || v === undefined) return ''; if (typeof v === 'boolean') return v ? 'VERDADERO' : 'FALSO'; if (typeof v === 'number') return String(Math.round(v * 1e10) / 1e10); if (isErr(v)) return v.err; if (v.rows) return txt(v.rows[0][0]); return String(v); }

  /* ---------- evaluación ---------- */
  function evalNode(n, ctx) {
    switch (n.k) {
      case 'num': case 'str': case 'bool': return n.v;
      case 'name': return ERR('#¿NOMBRE?');
      case 'ref': return ctx.get(n.a);
      case 'range': { const g = parseRange(n.a); const rows = []; for (let r = g.r1; r <= g.r2; r++) { const row = []; for (let c = g.c1; c <= g.c2; c++) row.push(ctx.get(addr(c, r))); rows.push(row); } return { rows }; }
      case 'neg': { const v = toNum(scalar(evalNode(n.e, ctx))); return isErr(v) ? v : -v; }
      case 'call': {
        const name = alias[n.n] !== undefined ? alias[n.n] : n.n; const fn = name && F[name]; if (!fn) return ERR('#¿NOMBRE?');
        const lazy = name === 'SI';
        if (lazy) { const c = scalar(evalNode(n.args[0], ctx)); if (isErr(c)) return c; const b = truthy(c); if (isErr(b)) return b; if (b) return n.args.length > 1 ? scalar(evalNode(n.args[1], ctx)) : true; return n.args.length > 2 ? scalar(evalNode(n.args[2], ctx)) : false; }
        const args = n.args.map((a) => evalNode(a, ctx));
        const keepsRange = ['SUMA', 'PROMEDIO', 'MAX', 'MIN', 'CONTAR', 'CONTARA', 'CONTAR.BLANCO', 'CONTAR.SI', 'SUMAR.SI', 'PROMEDIO.SI', 'BUSCARV', 'MEDIANA', 'MODA', 'Y', 'O', 'CONCATENAR'];
        const fa = keepsRange.includes(name) ? args : args.map(scalar);
        if (!['CONTAR', 'CONTARA', 'CONTAR.BLANCO', 'CONTAR.SI', 'SUMAR.SI', 'PROMEDIO.SI', 'BUSCARV'].includes(name)) { for (const a of fa) if (isErr(a)) return a; }

        }
        const x = toNum(l), y = toNum(r); if (isErr(x)) return x; if (isErr(y)) return y;

      }
    }

  }

    if (raw === null || raw === undefined) return null; const s = String(raw);
    if (s.trim() === '') return null;

    return s;
  }

    const cache = new Map(); const stack = new Set(); const astCache = new Map();
    const ctx = { get: (a) => value(a) };
    function value(a) {
      a = a.toUpperCase();
      if (cache.has(a)) return cache.get(a);
      const r = raw[a];
      if (typeof r !== 'string' || !r.startsWith('=')) { const v = literal(r); cache.set(a, v); return v; }
      if (stack.has(a)) return ERR('#¡CIRC!');

    }
    return parts.join('"');
  }

  function fmt(v) {
    if (v === null || v === undefined) return '';
    if (isErr(v)) return v.err;
    if (typeof v === 'boolean') return v ? 'VERDADERO' : 'FALSO';
    if (typeof v === 'number') { if (!isFinite(v)) return '#¡NUM!'; if (Number.isInteger(v)) return String(v); const r = Math.round(v * 100) / 100; return String(r); }
    return String(v);
  }

})();

<script>
(() => {
const Q = (q, ok, wrong, fb, hint) => ({ q, opts: [ok, ...wrong], a: 0, fb, hint });

      host.innerHTML = (d.lead ? `${d.lead ? `<div class="lead-card">${d.lead}</div>` : ""}` : '') + sets.map((s, si) => `<div class="ord-set" data-s="${si}"><p class="ord-prompt">${esc(s.prompt)}</p><div class="ord-wrap ${s.layers ? 'with-prev' : ''}"><ol class="ord">${st.ord[si].map((ix, pos) => `<li data-ix="${ix}"><span class="grip" aria-hidden="true" title="Arrastra para mover">⠿</span><span class="ord-t">${s.html ? s.items[ix] : esc(s.items[ix])}</span><span class="ord-btns"><button type="button" data-s="${si}" data-p="${pos}" data-d="-1" aria-label="Subir" ${pos === 0 ? 'disabled' : ''}>↑</button><button type="button" data-s="${si}" data-p="${pos}" data-d="1" aria-label="Bajar" ${pos === s.items.length - 1 ? 'disabled' : ''}>↓</button></span></li>`).join('')}</ol>${s.layers ? `<div class="layer-prev"><svg viewBox="0 0 300 200">${[...st.ord[si]].reverse().map((ix) => s.layers[ix]).join('')}</svg><span class="muted small">Vista del lienzo: la capa de arriba en la lista se dibuja encima.</span></div>` : ''}</div></div>`).join('');

      const b = e.target.closest('button[data-d]'); if (!b) return; const si = +b.dataset.s, p = +b.dataset.p, dd = +b.dataset.d; const o = st.ord[si]; const q = p + dd; if (q < 0 || q >= o.length) return;
      [o[p], o[q]] = [o[q], o[p]]; api.save(st); draw(); const nb = $(`button[data-s="${si}"][data-p="${q}"][data-d="${dd}"]`, host) || $(`button[data-s="${si}"][data-p="${q}"]`, host); if (nb && !nb.disabled) nb.focus();

    let dragLi = null;
    host.addEventListener('pointerdown', (e) => { const li = e.target.closest('.ord li'); if (!li || e.target.closest('button')) return; if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return; dragLi = li; li.classList.add('dragging'); try { li.setPointerCapture(e.pointerId); } catch (er) { /* */ } e.preventDefault(); });
    host.addEventListener('pointermove', (e) => { if (!dragLi) return; const ol = dragLi.parentNode; const after = [...ol.children].filter((x) => x !== dragLi).find((x) => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; }); if (after) { if (after !== dragLi.nextSibling) ol.insertBefore(dragLi, after); } else if (ol.lastChild !== dragLi) ol.appendChild(dragLi); });

    host.addEventListener('pointerup', endDrag); host.addEventListener('pointercancel', endDrag);
    draw();
    return {
      check() {
        let tot = 0, allOk = 0;
        sets.forEach((s, si) => { const o = st.ord[si]; const c = o.filter((ix, pos) => ix === pos).length; $$(`.ord-set[data-s="${si}"] .ord li`, host).forEach((li, pos) => { li.classList.remove('ok', 'bad'); li.classList.add(+li.dataset.ix === pos ? 'ok' : 'bad'); }); tot += c / o.length; const el = $(`.ord-set[data-s="${si}"]`, host); el.classList.remove('ok', 'bad'); el.classList.add(c === o.length ? 'ok' : 'bad'); if (c === o.length) allOk++; });
        return { score: tot / sets.length, msg: allOk === sets.length ? 'El orden es correcto.' : `${allOk} de ${sets.length} secuencia(s) en orden correcto. Los elementos en su lugar suman puntos.` };
      }

  };

  /* --- contraseñas --- */
  E.password = (host, d, api) => {
    const st = api.load() || { pw: '', order: shuffle(d.samples.length), ans: Array(d.samples.length).fill(-1) };
    const rules = [
      ['Al menos 12 caracteres', (p) => p.length >= 12],
      ['Una mayúscula', (p) => /[A-ZÁÉÍÓÚÑ]/.test(p)],
      ['Una minúscula', (p) => /[a-záéíóúñ]/.test(p)],
      ['Un número', (p) => /\d/.test(p)],
      ['Un símbolo (por ejemplo ! ? # -)', (p) => /[^A-Za-z0-9ÁÉÍÓÚÑáéíóúñ\s]/.test(p)],

    ];
    host.innerHTML = `${d.lead ? `<div class="lead-card">${d.lead}</div>` : ""}

      <h3 class="sub">Ahora clasifica estas contraseñas de ejemplo</h3><div class="pw-cls"></div>`;
    const upd = () => {
      const p = st.pw; const ok = rules.map((r) => r[1](p)); const n = ok.filter(Boolean).length;
      $$('.rules li', host).forEach((li, i) => li.classList.toggle('on', ok[i]));
      const pct = p ? Math.round((n / rules.length) * 100) : 0; const bar = $('.meter-bar', host); bar.style.width = pct + '%'; bar.dataset.lv = n <= 3 ? 'low' : n <= 5 ? 'mid' : 'high';

      }

  };

  /* --- reescribir mensajes con netiqueta --- */
  E.rewrite = (host, d, api) => {

    const shout = (t) => { const L = (t.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ]/g) || []); const U = (t.match(/[A-ZÁÉÍÓÚÑ]/g) || []); const caps = t.split(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]+/).filter((w) => w.length >= 3 && w === w.toUpperCase()); return caps.length >= 3 || (L.length >= 12 && U.length / L.length > 0.5); };
    const test = (t, m) => {
      const n = norm(t);
      return [
        ['Tiene al menos 20 caracteres', t.trim().length >= 20],
        ['No escribe en MAYÚSCULAS (se lee como gritar; las siglas como INEGI sí se valen)', !shout(t)],

    };

  };

  /* --- regla de los tercios --- */
  E.thirds = (host, d, api) => {
    const st = api.load() || { hy: 300, sx: 300, sy: 240, grid: true };
    host.innerHTML = `${d.lead ? `<div class="lead-card">${d.lead}</div>` : ""}<div class="thirds"><svg viewBox="0 0 600 400" class="th-svg" role="img" aria-label="Lienzo de composición"></svg>
      <div class="th-ctl"><label class="fld"><span>Horizonte (altura)</span><input type="range" min="40" max="360" data-k="hy"></label>
      <label class="fld"><span>Faro: posición horizontal</span><input type="range" min="40" max="560" data-k="sx"></label>

    const target = () => { const ty = Math.abs(st.hy - 133.3) < Math.abs(st.hy - 266.7) ? 133.3 : 266.7; let best = null; [200, 400].forEach((x) => [133.3, 266.7].forEach((y) => { const dd = Math.hypot(st.sx - x, st.sy + 20 - y); if (!best || dd < best.d) best = { x, y, d: dd }; })); return { ty, hOk: Math.abs(st.hy - ty) <= 22, ix: best.x, iy: best.y, sOk: best.d <= 40 }; };
    /* guía después de revisar: muestra en el dibujo dónde debían ir el horizonte y el faro */
    const guide = () => { const t = target(); let o = '';
      if (!t.hOk) o += `<line x1="0" x2="600" y1="${t.ty}" y2="${t.ty}" class="th-goal"/><path d="M40,${st.hy} L40,${t.ty}" class="th-arrow" marker-end="url(#tharr)"/><text x="60" y="${t.ty - 8}" class="th-lbl">El horizonte va aquí</text>`;
      if (!t.sOk) o += `<g transform="translate(${t.ix},${t.iy - 20})" opacity=".55"><rect x="-14" y="-6" width="28" height="70" fill="#fff" stroke="#12804F" stroke-dasharray="4 3"/><path d="M-12,-22 L0,-40 L12,-22Z" fill="#12804F"/></g><circle cx="${t.ix}" cy="${t.iy}" r="40" class="th-goalc"/><path d="M${st.sx},${st.sy + 20} L${t.ix},${t.iy}" class="th-arrow" marker-end="url(#tharr)"/><text x="${t.ix + 46 > 520 ? t.ix - 150 : t.ix + 46}" y="${t.iy + 5}" class="th-lbl">El faro va aquí</text>`;
      if (t.hOk && t.sOk) o += `<text x="20" y="30" class="th-lbl">✓ ¡Así está bien!</text>`;

      const g = st.grid ? [200, 400].map((x) => `<line x1="${x}" x2="${x}" y1="0" y2="400" class="th-g"/>`).join('') + [133.3, 266.7].map((y) => `<line y1="${y}" y2="${y}" x1="0" x2="600" class="th-g"/>`).join('') + [200, 400].flatMap((x) => [133.3, 266.7].map((y) => `<circle cx="${x}" cy="${y}" r="5" class="th-dot"/>`)).join('') : '';
      svg.innerHTML = `<defs><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7FB3E8"/><stop offset="1" stop-color="#F7C59F"/></linearGradient></defs>
      <rect width="600" height="${st.hy}" fill="url(#sky)"/><circle cx="470" cy="${Math.max(30, st.hy - 40)}" r="26" fill="#FFE08A" opacity=".9"/><rect y="${st.hy}" width="600" height="${400 - st.hy}" fill="#2E6F8E"/>
      <rect y="${st.hy}" width="600" height="6" fill="#ffffff" opacity=".25"/>
      <g class="th-sub" transform="translate(${st.sx},${st.sy})" style="cursor:grab"><rect x="-14" y="-6" width="28" height="70" fill="#F4F4F4" stroke="#33415C"/><rect x="-14" y="10" width="28" height="12" fill="#D64545"/><rect x="-14" y="36" width="28" height="12" fill="#D64545"/><rect x="-18" y="-22" width="36" height="16" fill="#33415C"/><path d="M-12,-22 L0,-40 L12,-22Z" fill="#D64545"/><rect x="-26" y="62" width="52" height="10" fill="#5B4636"/><circle r="5" fill="#FFE08A"/></g>
      <rect class="th-hz" y="${st.hy - 10}" width="600" height="20" fill="transparent" style="cursor:ns-resize"/>${st.guide || st.grid ? g || gridAll() : ''}${st.guide ? guide() : ''}`;
      $$('input[type=range]', host).forEach((r) => { r.value = st[r.dataset.k]; });

    host.addEventListener('input', (e) => { const k = e.target.dataset.k; if (!k) return; st[k] = e.target.type === 'checkbox' ? e.target.checked : +e.target.value; api.save(st); draw(); });
    let drag = null;
    const pt = (e) => { const r = svg.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * 600, y: ((e.clientY - r.top) / r.height) * 400 }; };
    svg.addEventListener('pointerdown', (e) => { if (e.target.closest('.th-sub')) drag = 'sub'; else if (e.target.closest('.th-hz')) drag = 'hz'; else return; svg.setPointerCapture(e.pointerId); e.preventDefault(); });
    svg.addEventListener('pointermove', (e) => { if (!drag) return; const p = pt(e); if (drag === 'sub') { st.sx = Math.round(Math.min(560, Math.max(40, p.x))); st.sy = Math.round(Math.min(340, Math.max(80, p.y))); } else st.hy = Math.round(Math.min(360, Math.max(40, p.y))); draw(); });

    return {
      check() {
        const hOk = Math.min(Math.abs(st.hy - 133.3), Math.abs(st.hy - 266.7)) <= 22;

      }

  };

      }

  /* --- robot en cuadrícula (programación por bloques) --- */
  E.robot = (host, d, api) => {
    let uid = 1;
    const st = api.load() || { lv: 0, progs: d.levels.map(() => []), solved: d.levels.map(() => 0) };
    st.progs.forEach((p) => { const walk = (l) => l.forEach((b) => { uid = Math.max(uid, b.id + 1); if (b.body) walk(b.body); }); walk(p); });
    let dest = null, running = false;
    const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    const NAMES = { avanzar: 'Avanzar 1 casilla', izq: 'Girar a la izquierda', der: 'Girar a la derecha', rep: 'Repetir' };
    const count = (l) => l.reduce((a, b) => a + 1 + (b.body ? count(b.body) : 0), 0);
    const find = (l, id) => { for (const b of l) { if (b.id === id) return b; if (b.body) { const r = find(b.body, id); if (r) return r; } } return null; };
    const remove = (l, id) => { const i = l.findIndex((b) => b.id === id); if (i >= 0) { l.splice(i, 1); return true; } return l.some((b) => b.body && remove(b.body, id)); };
    const draw = (pos) => {
      const L = d.levels[st.lv]; const prog = st.progs[st.lv]; const S = 44;
      const p = pos || { x: L.start[0], y: L.start[1], d: L.start[2], got: [] };
      let cells = '';
      for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) { const wall = L.walls.some((w) => w[0] === x && w[1] === y); cells += `<rect x="${x * S}" y="${y * S}" width="${S}" height="${S}" class="${wall ? 'rb-wall' : 'rb-cell'}"/>`; }
      const goal = `<g transform="translate(${L.goal[0] * S + S / 2},${L.goal[1] * S + S / 2})"><rect x="-4" y="-16" width="3" height="32" fill="var(--ink)"/><path d="M-1,-16 L15,-10 L-1,-4Z" fill="var(--creacion)"/></g>`;
      const stars = (L.stars || []).filter((s, i) => !p.got.includes(i)).map((s) => `<text x="${s[0] * S + S / 2}" y="${s[1] * S + S / 2 + 7}" text-anchor="middle" font-size="22">★</text>`).join('');
      const bot = `<g transform="translate(${p.x * S + S / 2},${p.y * S + S / 2}) rotate(${p.d * 90})"><circle r="15" fill="var(--codigo)"/><path d="M0,-12 L7,2 L-7,2Z" fill="#fff"/></g>`;
      const rb = (l, depth) => `<ul class="rb-prog ${depth ? 'nested' : ''}">${l.map((b) => `<li class="rb-b k-${b.k} ${dest === b.id ? 'dest' : ''}" data-id="${b.id}"><span>${b.k === 'rep' ? `Repetir <button type="button" class="mini" data-act="minus" data-id="${b.id}" aria-label="Menos">−</button><b>${b.n}</b><button type="button" class="mini" data-act="plus" data-id="${b.id}" aria-label="Más">+</button> veces ${dest === b.id ? '<em>(agregando aquí)</em>' : `<button type="button" class="mini txt" data-act="into" data-id="${b.id}">agregar dentro</button>`}` : NAMES[b.k]}</span><button type="button" class="mini x" data-act="del" data-id="${b.id}" aria-label="Quitar bloque">×</button>${b.k === 'rep' ? rb(b.body, depth + 1) : ''}</li>`).join('')}</ul>`;
      host.innerHTML = `${d.lead ? `<div class="lead-card">${d.lead}</div>` : ""}
        <div class="lv-tabs" role="tablist">${d.levels.map((l, i) => `<button type="button" role="tab" aria-selected="${i === st.lv}" data-lv="${i}">Nivel ${i + 1}${st.solved[i] >= 1 ? ' ✓' : ''}</button>`).join('')}</div>
        <p class="lv-goal">${esc(L.goalText)}${L.max ? ` Usa como máximo <b>${L.max}</b> bloques.` : ''}</p>
        <div class="rb-wrap"><svg viewBox="0 0 ${L.w * S} ${L.h * S}" class="rb-svg" style="max-width:${L.w * S * 1.3}px">${cells}${goal}${stars}${bot}</svg>
        <div class="rb-side"><div class="rb-pal">${(L.blocks || ['avanzar', 'izq', 'der']).map((k) => `<button type="button" class="pal k-${k}" data-add="${k}" ${running ? 'disabled' : ''}>${NAMES[k]}</button>`).join('')}</div>
        <div class="rb-head">Al presionar ▶ <span class="muted small">(${count(prog)} bloques)</span>${dest ? ` <button type="button" class="mini txt" data-act="out">volver al programa principal</button>` : ''}</div>${prog.length ? rb(prog, 0) : '<p class="muted small rb-empty">Agrega bloques desde la paleta.</p>'}
        <div class="row"><button type="button" class="btn primary" data-act="run" ${running ? 'disabled' : ''}>▶ Ejecutar</button><button type="button" class="btn" data-act="clear" ${running ? 'disabled' : ''}>Borrar programa</button></div><p class="rb-msg" aria-live="polite"></p></div></div>`;
    };
    host.addEventListener('click', (e) => {
      if (running) return;
      const t = e.target.closest('button'); if (!t) return; const prog = st.progs[st.lv];
      if (t.dataset.lv) { st.lv = +t.dataset.lv; dest = null; api.save(st); draw(); return; }
      if (t.dataset.add) { const b = { id: uid++, k: t.dataset.add }; if (b.k === 'rep') { b.n = 2; b.body = []; } const target = dest ? find(prog, dest) : null; (target ? target.body : prog).push(b); if (b.k === 'rep') dest = b.id; api.save(st); draw(); return; }
      const act = t.dataset.act, id = +t.dataset.id;
      if (act === 'del') { remove(prog, id); if (dest && !find(prog, dest)) dest = null; }
      if (act === 'plus') { const b = find(prog, id); b.n = Math.min(9, b.n + 1); }
      if (act === 'minus') { const b = find(prog, id); b.n = Math.max(2, b.n - 1); }
      if (act === 'into') dest = id;
      if (act === 'out') dest = null;
      if (act === 'clear') { st.progs[st.lv] = []; dest = null; }
      if (act === 'run') { run(); return; }
      api.save(st); draw();
    });
    function run() {
      const L = d.levels[st.lv]; const lvl = st.lv; const steps = [];
      const flat = (l) => { for (const b of l) { if (steps.length > 300) return; if (b.k === 'rep') for (let i = 0; i < b.n; i++) flat(b.body); else steps.push(b.k); } };
      flat(st.progs[lvl]);
      const pos = { x: L.start[0], y: L.start[1], d: L.start[2], got: [] };
      running = true; draw(pos); let i = 0;
      const msg = (t, cls) => { const m = $('.rb-msg', host); m.textContent = t; m.className = 'rb-msg ' + (cls || ''); };
      if (!steps.length) { running = false; draw(); msg('El programa está vacío.', 'bad'); return; }
      const tick = () => {
        if (i >= steps.length) {
          running = false; const allStars = (L.stars || []).length === pos.got.length; const atGoal = pos.x === L.goal[0] && pos.y === L.goal[1];
          let sc = 0, txt;
          if (atGoal && allStars) { const n = count(st.progs[lvl]); if (L.max && n > L.max) { sc = 0.7; txt = `¡Llegó! Pero usaste ${n} bloques y el reto pide ${L.max} como máximo. Usa “Repetir” para acortar el programa.`; } else { sc = 1; txt = '¡Lo lograste! El robot llegó a la meta.'; } }
          else if (atGoal) txt = 'Llegó a la meta, pero le faltan estrellas por recoger.'; else txt = 'El programa terminó y el robot no está en la meta. Ajusta los bloques.';
          st.solved[lvl] = Math.max(st.solved[lvl], sc); api.save(st); draw(pos); msg(txt + ' Cuando termines todos los niveles, presiona Revisar.', sc >= 1 ? 'ok' : 'bad'); return;
        }

        if (k === 'izq') pos.d = (pos.d + 3) % 4; else if (k === 'der') pos.d = (pos.d + 1) % 4;
        else { const nx = pos.x + DIRS[pos.d][0], ny = pos.y + DIRS[pos.d][1]; if (nx < 0 || ny < 0 || nx >= L.w || ny >= L.h || L.walls.some((w) => w[0] === nx && w[1] === ny)) { running = false; draw(pos); msg(`¡Choque en el paso ${i}! Hay una pared o el borde enfrente.`, 'bad'); return; } pos.x = nx; pos.y = ny; (L.stars || []).forEach((s, si) => { if (s[0] === nx && s[1] === ny && !pos.got.includes(si)) pos.got.push(si); }); }
        draw(pos); setTimeout(tick, matchMedia('(prefers-reduced-motion: reduce)').matches ? 60 : 280);
      };

    draw();
    return { check() { const s = st.solved.reduce((a, b) => a + b, 0) / st.solved.length; return { score: s, msg: `Niveles resueltos: ${st.solved.filter((x) => x >= 1).length} de ${st.solved.length}. Ejecuta el programa de cada nivel para que cuente.` }; } };
  };

  /* --- rastrear programas: predecir el resultado --- */
  E.trace = (host, d, api) => {
    const st = api.load() || { ans: d.items.map(() => '') };
    host.innerHTML = (d.lead ? `${d.lead ? `<div class="lead-card">${d.lead}</div>` : ""}` : '') + d.items.map((it, i) => `<div class="tr" data-i="${i}"><pre class="code">${it.code.split('\n').map((l, n) => `<span class="ln">${n + 1}</span>${esc(l)}`).join('\n')}</pre><div class="tr-q"><p>${esc(it.q)}</p>${it.opts ? it.opts.map((o, oi) => `<label class="opt"><input type="radio" name="tr${api.pid}_${i}" value="${oi}" ${String(st.ans[i]) === String(oi) ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('') : `<input class="tr-in" type="text" value="${esc(st.ans[i])}" placeholder="Tu respuesta" autocomplete="off">`}<p class="q-fb" aria-live="polite"></p></div></div>`).join('');
    host.addEventListener('input', (e) => { const el = e.target.closest('.tr'); if (!el) return; st.ans[+el.dataset.i] = e.target.value; el.classList.remove('ok', 'bad'); $('.q-fb', el).textContent = ''; api.save(st); });
    return {
      check() {
        let ok = 0;
        d.items.forEach((it, i) => { const el = $(`.tr[data-i="${i}"]`, host); const a = String(st.ans[i] ?? '').trim(); const sq = (x) => norm(x).replace(/[^a-z0-9ñ\-]/g, ''); const good = it.opts ? a === String(it.a) : (a !== '' && (sq(a) === sq(String(it.a)) || (it.alt || []).some((x) => sq(a) === sq(x)))); el.classList.remove('ok', 'bad'); el.classList.add(good ? 'ok' : 'bad'); $('.q-fb', el).textContent = good ? '✓ ' + (it.fb || 'Correcto.') : (a ? 'Sigue el programa línea por línea anotando el valor de cada variable.' : 'Falta tu respuesta.'); if (good) ok++; });
        const empty = d.items.filter((it, i) => String(st.ans[i] ?? '').trim() === '').length; return { score: ok / d.items.length, incomplete: empty > 0, msg: empty ? `Te faltan ${empty} respuesta(s).` : `${ok} de ${d.items.length} correctas.` };
      }
    };
  };

  /* --- simulación con dados --- */
  E.simulate = (host, d, api) => {
    const st = api.load() || { mode: 1, c1: Array(6).fill(0), c2: Array(11).fill(0), ans: d.qs.map(() => -1) };
    const draw = () => {
      const one = st.mode === 1; const c = one ? st.c1 : st.c2; const n = c.reduce((a, b) => a + b, 0);
      const labels = one ? ['1', '2', '3', '4', '5', '6'] : Array.from({ length: 11 }, (_, i) => String(i + 2));
      $('.sim-out', host).innerHTML = `<div class="seg" role="group" aria-label="Modo"><button type="button" data-m="1" aria-pressed="${one}">1 dado</button><button type="button" data-m="2" aria-pressed="${!one}">Suma de 2 dados</button></div>
        <div class="row"><button type="button" class="btn" data-r="10">Lanzar 10</button><button type="button" class="btn" data-r="100">Lanzar 100</button><button type="button" class="btn primary" data-r="1000">Lanzar 1000</button><button type="button" class="btn ghost" data-r="0">Reiniciar conteo</button></div>
        <p><b>${n}</b> lanzamientos en este modo.</p>
        <div class="tbl-wrap"><table class="freq"><tr><th>Resultado</th>${labels.map((l) => `<th>${l}</th>`).join('')}</tr><tr><th>Frecuencia</th>${c.map((x) => `<td>${x}</td>`).join('')}</tr><tr><th>Relativa</th>${c.map((x) => `<td>${n ? Math.round((x / n) * 1000) / 10 + '%' : '—'}</td>`).join('')}</tr></table></div>
        ${n ? svgChart({ type: 'columnas', labels, series: [{ name: 'Frecuencia', values: c }], title: one ? 'Frecuencia de cada cara' : 'Frecuencia de cada suma' }) : ''}`;
    };
    host.innerHTML = `${d.lead ? `<div class="lead-card">${d.lead}</div>` : ""}<div class="sim-out"></div><h3 class="sub">Preguntas</h3><div class="sim-q"></div>`;
    host.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.m) { st.mode = +b.dataset.m; api.save(st); draw(); }
      if (b.dataset.r !== undefined) { const r = +b.dataset.r; if (r === 0) { if (st.mode === 1) st.c1 = Array(6).fill(0); else st.c2 = Array(11).fill(0); } else for (let i = 0; i < r; i++) { const a = 1 + Math.floor(Math.random() * 6); if (st.mode === 1) st.c1[a - 1]++; else st.c2[a + 1 + Math.floor(Math.random() * 6) - 2]++; } api.save(st); draw(); }
    });

    return {
      check() {
        const n1 = st.c1.reduce((a, b) => a + b, 0), n2 = st.c2.reduce((a, b) => a + b, 0); const r = q.check();

      }
    };
  };

  /* --- paleta con contraste --- */
  E.contrast = (host, d, api) => {
    const st = api.load() || { bg: -1, tx: -1, ac: -1 };
    const lum = (hex) => { const v = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4))); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
    const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
    const roles = [['bg', 'Fondo'], ['tx', 'Texto'], ['ac', 'Acento (botón o franja)']];
    const draw = () => {
      const P = d.palette; const bg = P[st.bg] || '#ffffff', tx = P[st.tx] || '#999999', ac = P[st.ac] || '#cccccc';
      const r1 = st.bg >= 0 && st.tx >= 0 ? ratio(bg, tx) : 0, r2 = st.bg >= 0 && st.ac >= 0 ? ratio(bg, ac) : 0;
      host.innerHTML = `${d.lead ? `<div class="lead-card">${d.lead}</div>` : ""}<div class="ct-grid"><div>${roles.map(([k, n]) => `<div class="ct-role"><span>${n}</span><div class="sw-row">${P.map((c, i) => `<button type="button" class="sw" data-k="${k}" data-i="${i}" style="background:${c}" aria-pressed="${st[k] === i}" aria-label="${n}: color ${c}"></button>`).join('')}</div></div>`).join('')}
        <ul class="rules small"><li class="${r1 >= 4.5 ? 'on' : ''}">Contraste texto/fondo de al menos 4.5 : 1 (llevas ${r1 ? r1.toFixed(1) : '—'})</li><li class="${r2 >= 3 ? 'on' : ''}">Contraste acento/fondo de al menos 3 : 1 (llevas ${r2 ? r2.toFixed(1) : '—'})</li><li class="${new Set([st.bg, st.tx, st.ac]).size === 3 && st.ac >= 0 && st.bg >= 0 && st.tx >= 0 ? 'on' : ''}">Tres colores distintos</li></ul></div>
        <div class="post" style="background:${bg};color:${tx}"><div class="post-band" style="background:${ac}"></div><h4>${esc(d.title)}</h4><p>${esc(d.body)}</p><span class="post-btn" style="background:${ac};color:${bg}">${esc(d.cta)}</span></div></div>`;
    };

      check() {

        return { score: [a, b, c].filter(Boolean).length / 3, msg: a && b && c ? 'Tu paleta es legible y coherente.' : 'Ajusta los criterios sin palomita: un texto con poco contraste no se lee en el celular.' };
      }
    };
  };

  /* --- editor HTML/CSS/JS con vista previa --- */
  E.html = (host, d, api) => {
    const st = api.load() || { code: d.starter };
    host.innerHTML = `${d.lead ? `<div class="lead-card">${d.lead}</div>` : ""}<div class="ed"><label class="fld ed-code"><span>Tu código</span><textarea spellcheck="false" autocapitalize="off" autocomplete="off">${esc(st.code)}</textarea></label><div class="ed-prev"><span class="muted small">Vista previa</span><iframe sandbox="allow-scripts" title="Vista previa de tu página"></iframe></div></div><ul class="rules small ed-rules">${d.checks.map((c) => `<li>${esc(c.t)}</li>`).join('')}</ul>`;
    const ta = $('textarea', host), fr = $('iframe', host);
    let tmr; const render = () => { fr.srcdoc = st.code; };
    ta.addEventListener('input', () => { st.code = ta.value; api.save(st); clearTimeout(tmr); tmr = setTimeout(render, 450); });
    ta.addEventListener('keydown', (e) => { if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); st.code = ta.value; api.save(st); } });
    render();
    return {
      check() {
        const doc = new DOMParser().parseFromString(st.code, 'text/html'); const res = d.checks.map((c) => { try { return !!c.f(doc, st.code); } catch (e) { return false; } });
        $$('.ed-rules li', host).forEach((li, i) => li.classList.toggle('on', res[i]));
        const n = res.filter(Boolean).length; return { score: n / res.length, msg: `${n} de ${res.length} requisitos cumplidos.` };
      }
    };
  };

  /* --- respuesta abierta guiada --- */
  E.form = (host, d, api) => {
    const st = api.load() || { v: d.fields.map(() => '') };
    host.innerHTML = `${d.lead ? `<div class="lead-card">${d.lead}</div>` : ""}` + d.fields.map((f, i) => `<label class="fld" data-i="${i}"><span>${esc(f.label)}</span>${f.rows === 1 ? `<input type="text" value="${esc(st.v[i])}" placeholder="${esc(f.ph || '')}">` : `<textarea rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(st.v[i])}</textarea>`}<small class="muted cnt"></small></label>`).join('') + `<div class="row"><button type="button" class="btn ghost" data-act="copy">Copiar mis respuestas</button><span class="muted small copy-t" aria-live="polite"></span></div>`;
    const ok = (i) => { const f = d.fields[i], v = st.v[i]; const n = norm(v); return v.trim().length >= (f.min || 1) && (f.need || []).every((w) => n.includes(norm(w))); };

    host.addEventListener('click', async (e) => { if (e.target.dataset.act !== 'copy') return; const t = d.fields.map((f, i) => `${f.label}\n${st.v[i]}`).join('\n\n'); try { await navigator.clipboard.writeText(t); $('.copy-t', host).textContent = 'Copiado. Pégalo en tu documento de entrega.'; } catch (err) { $('.copy-t', host).textContent = 'No se pudo copiar automáticamente; selecciona el texto y cópialo.'; } });
    return { check() { const n = d.fields.filter((_, i) => ok(i)).length; return { score: n / d.fields.length, msg: n === d.fields.length ? 'Todas tus respuestas cumplen con lo que se pide.' : `${n} de ${d.fields.length} respuestas completas. Revisa la extensión mínima y las palabras que deben aparecer.` }; } };
  };

  /* --- sistema binario --- */

    const n = d.bits || 8; const W = Array.from({ length: n }, (_, i) => 2 ** (n - 1 - i));
    const st = api.load() || { b: d.items.map((it) => (it.bits ? it.bits.split('').map(Number) : Array(n).fill(0))), a: d.items.map(() => '') };
    const val = (bits) => bits.reduce((s, b, i) => s + b * W[i], 0);

      host.innerHTML = (d.lead ? `<div class="lead-card">${d.lead}</div>` : '') + d.items.map((it, i) => {
        const fixed = it.mode === 'read'; const v = val(st.b[i]);
        return `<div class="bin" data-i="${i}"><p class="bin-q"><b>${i + 1}.</b> ${esc(it.q)}</p><div class="bin-row" role="group" aria-label="Bits">${st.b[i].map((b, k) => `<button type="button" class="bit" data-i="${i}" data-k="${k}" aria-pressed="${!!b}" ${fixed ? 'disabled' : ''}><span class="bit-v">${b}</span><span class="bit-w">${W[k]}</span></button>`).join('')}</div>
          ${fixed ? `<label class="fld"><span>Valor en decimal</span><input type="text" inputmode="numeric" class="bin-in" data-i="${i}" value="${esc(st.a[i])}" autocomplete="off"></label>` : `<p class="bin-sum">Suma de los valores encendidos: <b>${v}</b>${it.char ? ` · carácter: <b>${v >= 32 && v < 127 ? esc(String.fromCharCode(v)) : '—'}</b>` : ''}</p>`}<p class="q-fb" aria-live="polite"></p></div>`;
      }).join('');
    };
    host.addEventListener('click', (e) => { const b = e.target.closest('.bit'); if (!b || b.disabled) return; const i = +b.dataset.i, k = +b.dataset.k; st.b[i][k] = st.b[i][k] ? 0 : 1; api.save(st); draw(); const nb = $(`.bit[data-i="${i}"][data-k="${k}"]`, host); if (nb) nb.focus(); });
    host.addEventListener('input', (e) => { const el = e.target.closest('.bin-in'); if (!el) return; st.a[+el.dataset.i] = el.value; api.save(st); });
    draw();
    return {
      check() {
        let ok = 0;
        d.items.forEach((it, i) => { const el = $(`.bin[data-i="${i}"]`, host); const good = it.mode === 'read' ? String(st.a[i]).trim() !== '' && +String(st.a[i]).trim() === val(st.b[i]) : val(st.b[i]) === it.target; el.classList.remove('ok', 'bad'); el.classList.add(good ? 'ok' : 'bad'); $('.q-fb', el).textContent = good ? '✓ ' + (it.fb || 'Correcto.') : (it.mode === 'read' ? 'Suma solo los valores de las casillas que tienen 1.' : `Llevas ${val(st.b[i])}. Enciende los valores que sumen ${it.target}: empieza por el más grande que quepa.`); if (good) ok++; });
        return { score: ok / d.items.length, msg: `${ok} de ${d.items.length} correctas.` };
      }
    };
  };

  /* --- circuito con LED: ley de Ohm --- */
  E.circuit = (host, d, api) => {

        else { if (!okRange(fv('frange'))) { flash('Escribe un rango válido, por ejemplo E4:H7.'); return; } FX.rangeCells(fv('frange').toUpperCase()).forEach((ad) => { const q = FX.parseAddr(ad); if (q.r > R || q.c > C) return; st.raw[ad] = FX.shift(src, q.r - p.r, q.c - p.c); }); }
        api.save(st); renderGrid(); select(sel, false, true); flash(`Listo: se copió ${sa}. Revisa los resultados en la hoja.`, true); return;
      }
      if (a === 'cf') { const r = fv('range').toUpperCase(); if (!okRange(r)) { flash('Escribe un rango válido, por ejemplo E2:E6.'); return; } if (fv('value') === '') { flash('Escribe el valor de la condición.'); return; } st.cf.push({ range: r, op: fv('op'), value: fv('value'), color: fv('color') }); }
      if (a === 'chart') { const L = fv('labels').toUpperCase(), V = fv('values').toUpperCase(); if (!okRange(L) || !okRange(V)) { flash('Escribe rangos válidos para etiquetas y valores, por ejemplo A2:A6 y B2:B6.'); return; } const gL = FX.parseRange(L), gV = FX.parseRange(V); let Lr = L, Vr = V;
        /* si el rango incluye la fila de encabezados (texto), se usa como nombre de la serie, como en Excel */
        if (gL.r1 === gV.r1 && gV.r2 > gV.r1) { let txt = true; for (let c = gV.c1; c <= gV.c2; c++) { const v = sheet.value(FX.addr(c, gV.r1)); if (typeof v === 'number' || v === null || v === '') txt = false; } if (txt) { Lr = FX.addr(gL.c1, gL.r1 + 1) + ':' + FX.addr(gL.c2, gL.r2); Vr = FX.addr(gV.c1, gV.r1 + 1) + ':' + FX.addr(gV.c2, gV.r2); } }

    }
    function rangeVals(s) { const g = FX.parseRange(s); const cols = []; for (let c = g.c1; c <= g.c2; c++) { const v = []; for (let r = g.r1; r <= g.r2; r++) v.push(sheet.value(FX.addr(c, r))); cols.push({ c, v }); } return { g, cols }; }
    function pivotData() { const hd = headers(); const g = FX.parseRange(d.pivotSource); const rc = g.c1 + hd.indexOf(st.pivot.row), vc = g.c1 + hd.indexOf(st.pivot.value); const m = new Map(); for (let r = g.r1 + 1; r <= g.r2; r++) { const k = FX.fmt(sheet.value(FX.addr(rc, r))); if (k === '') continue; const v = sheet.value(FX.addr(vc, r)); const e = m.get(k) || { s: 0, n: 0, c: 0 }; e.c++; if (typeof v === 'number') { e.s += v; e.n++; } m.set(k, e); } return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'es')).map(([k, e]) => [k, st.pivot.agg === 'SUMA' ? e.s : st.pivot.agg === 'CONTAR' ? e.c : (e.n ? e.s / e.n : 0)]); }
    function renderOutputs() {
      const o = $('.outputs', host); let h = '';

      if (st.pivot) { const rows = pivotData(); h += `<div class="out-card"><div class="out-h">Tabla dinámica: ${esc(st.pivot.agg)} de ${esc(st.pivot.value)} por ${esc(st.pivot.row)} <button type="button" class="mini x" data-act="delpivot" aria-label="Quitar tabla dinámica">×</button></div><table class="pivot"><tr><th>${esc(st.pivot.row)}</th><th>${esc(st.pivot.agg)} de ${esc(st.pivot.value)}</th></tr>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${FX.fmt(v)}</td></tr>`).join('')}<tr class="tot"><td>Total general</td><td class="num">${FX.fmt(st.pivot.agg === 'PROMEDIO' ? '' : rows.reduce((a, r) => a + r[1], 0))}</td></tr></table></div>`; }

    renderGrid(); select('A1');

    const eqv = (v, x, tol = 0.011) => (typeof x === 'number' ? typeof v === 'number' && Math.abs(v - x) <= tol : FX.norm(FX.fmt(v)) === FX.norm(x));
    const rawU = (a) => String(st.raw[a] ?? '').toUpperCase().replace(/\s+/g, '').replace(/;/g, ',');
    /* una referencia absoluta $E$7 también se acepta como E$7 (fija la fila); el resultado se valida aparte */

  /* --- completar código (espacios ⟪respuesta|alternativa⟫ dentro del código) --- */
  E.fill = (host, d, api) => {

        }).catch(() => local('✓ Sin conexión con la hoja: la contraseña se guardó solo en esta computadora.'));
      });
    };
    /* 2. reiniciar a un alumno */
    const reiniciar = () => {
      if (!registered()) { pn.innerHTML = '<p>Para reiniciar, primero el alumno debe escribir arriba su <b>nombre y apellidos</b> y su <b>grupo</b>. Después vuelve a abrir este panel.</p>'; return; }
      const curX = byPid[curHash] || (byTid[curHash] && byTid[curHash].ex[0]);
      const lab = curX ? `${LET[curX.tema.mi]}${curX.tema.ti + 1}.${curX.ei + 1}` : '';
      pn.innerHTML = `<h3 class="sub">Reinicio docente</h3><p>Alumno: <b>${esc(store.name.trim())}</b> · Grupo <b>${esc(store.grupo)}</b> · ${esc(G.short)}</p>
        <fieldset class="docopts"><legend>¿Qué quieres reiniciar?</legend>${lab ? `<label class="chk"><input type="radio" name="docej" value="${lab}" checked> Solo este ejercicio (${lab}): intentos, calificación y trabajo</label>` : ''}<label class="chk"><input type="radio" name="docej" value="*" ${lab ? '' : 'checked'}> Todo el simulador de este alumno</label></fieldset>
        <label class="fld"><span>Contraseña docente</span><input type="password" id="docclave" autocomplete="off"></label>
        <div class="row"><button type="button" class="btn primary" id="docgo">Reiniciar</button><button type="button" class="btn ghost" id="doccancel">Cancelar</button></div><p class="docmsg" aria-live="polite"></p>`;
      $('#doccancel').addEventListener('click', close); $('#docclave').focus();

        const clave = $('#docclave').value; const ej = (pn.querySelector('input[name="docej"]:checked') || {}).value || '*'; const msg = $('.docmsg');

        const listo = (sin) => { close(); route(curHash); const t = document.createElement('p'); t.className = 'docok'; t.textContent = `✓ Reiniciado: ${ej === '*' ? 'todo el simulador' : 'el ejercicio ' + ej} de ${store.name.trim()}.${sin ? ' (Sin internet: tu hoja se actualizará cuando haya conexión.)' : ''}`; $('.tfoot').prepend(t); setTimeout(() => t.remove(), 8000); };

          huella(clave).then((h) => { if (h !== known()) { msg.textContent = 'Contraseña incorrecta.'; $('#docgo').disabled = false; return; } localReset(ej); listo(true); }); };
        if (!online()) { offline(); return; }
        const q = `accion=reiniciar&clave=${encodeURIComponent(clave)}&alumno=${encodeURIComponent(store.name.trim())}&grupo=${encodeURIComponent(store.grupo)}&grado=${encodeURIComponent(G.short)}&ej=${encodeURIComponent(ej)}`;
        fetch(`${REPORT_URL}?${q}`).then((r) => r.json()).then((d) => {
          if (!d || !d.ok) { if (d && /Aún no hay contraseña/.test(d.msg || '')) { crear('Todavía no hay una contraseña docente. Créala ahora:'); return; } msg.textContent = (d && d.msg) || 'No se pudo reiniciar.'; $('#docgo').disabled = false; return; }
          huella(clave).then((h) => { store.claveHash = h; persist(); }); applyReset(d.id, d.ej); listo(false);
        }).catch(offline);

    };
    if (!online()) { if (known()) reiniciar(); else crear('Esta computadora todavía no tiene contraseña docente. Créala aquí: solo tú la debes conocer. Como no hay internet, se guardará solo en esta computadora.'); return; }
    pn.innerHTML = '<p class="muted">Revisando…</p>';
    fetch(`${REPORT_URL}?accion=hayclave`).then((r) => r.json()).then((d) => { if (d && d.ok && !d.existe) crear('Es la primera vez: crea tu contraseña docente. Solo tú la debes conocer; servirá en todas las computadoras.'); else reiniciar(); })
      .catch(() => { if (known()) reiniciar(); else crear('No hay conexión con tu hoja. Crea una contraseña para esta computadora:'); });
  }
  function practice(pid) {
    const x = byPid[pid]; if (!x) { home(); return; }
    const tm = x.tema; side(tm.tid); const p = x.p; const idx = exs.indexOf(x); const prev = exs[idx - 1], next = exs[idx + 1];
    const best = store.prog[pid];
    const nextLabel = next ? (next.tid === tm.tid ? `Ejercicio ${next.ei + 1} →` : `Siguiente tema: ${LET[next.tema.mi]}${next.tema.ti + 1} →`) : '';
    $('#main').innerHTML = `<article class="prac" style="--hc:var(--${tm.m.hilo})"><a href="#" class="back">← Mapa de prácticas</a>
      <p class="crumb"><span class="mcol">${LET[tm.mi]}${tm.ti + 1}</span> ${esc(tm.m.sub || '')} · ${esc(tm.m.name)} · Tema ${LET[tm.mi]}${tm.ti + 1}</p>
