      <div class="extabs" role="tablist">${tm.ex.map((e) => `<a role="tab" href="#${e.pid}" class="extab st-${status(e.pid)}" aria-selected="${e.pid === pid}"><span class="exn">Ejercicio ${e.ei + 1}</span><span class="exl">${esc(e.label)}${stIcon[status(e.pid)] ? ' ' + stIcon[status(e.pid)] : ''}</span></a>`).join('')}</div>
      ${tm.t.caso ? `<div class="caso${tm.t.reto ? ' is-reto' : ''}"><p class="caso-h"><span aria-hidden="true">${tm.t.reto ? '🏆' : '📖'}</span> ${tm.t.reto ? 'Reto de la semana' : 'Caso'}: <b>${esc(tm.t.caso.t)}</b></p><p>${esc(tm.t.caso.x)}</p></div>` : ''}
      <h3 class="extitle">Ejercicio ${x.ei + 1} de ${tm.ex.length}${p.title ? ': ' + esc(p.title) : ''}</h3>
      <p class="intro">${p.intro}</p>
      <details class="help" open><summary>¿Cómo se resuelve?</summary><div>${p.help || HELP[p.type] || ''}</div></details>
      ${p.tip ? `<details class="tip"><summary>Ver pista</summary><div>${/\n/.test(p.tip) && !/</.test(p.tip) ? `<pre class="code">${esc(p.tip)}</pre>` : p.tip}</div></details>` : ''}
      <div class="engine"></div>
      ${tm.t.reto ? `<label class="fld exp-box"><span>✍️ <b>Explica con tus palabras cómo resolviste el reto</b>: qué hiciste primero, qué usaste de los temas y qué se te dificultó (mínimo 60 caracteres). Tu maestra o maestro lo leerá.</span><textarea id="exp" rows="3">${esc(store.exp[pid] || '')}</textarea><span class="muted small exp-n"></span></label>` : ''}
      <div class="result" aria-live="polite"></div>
      <div class="foot"><button type="button" class="btn primary" id="chk">Revisar</button><span class="att" aria-live="polite"></span><button type="button" class="btn ghost" id="rst">Empezar de nuevo</button><span class="grow"></span>${prev ? `<a class="btn ghost" href="#${prev.pid}">← Anterior</a>` : ''}${next ? `<a class="btn" href="#${next.pid}">${nextLabel}</a>` : ''}</div></article>`;
    const api = { pid, load: () => (store.saves[pid] ? JSON.parse(JSON.stringify(store.saves[pid])) : null), save: (s) => { store.saves[pid] = s; persist(); }, autoCheck: () => doCheck(true) };
    const expN = () => { const n = (store.exp[pid] || '').trim().length; const el = $('.exp-n'); if (el) el.textContent = `${n} caracteres${n < 60 ? ` (faltan ${60 - n})` : ' ✓'}`; };
    if ($('#exp')) { $('#exp').addEventListener('input', (e) => { store.exp[pid] = e.target.value.slice(0, 1500); persist(); expN(); }); expN(); }
    let eng;
    try { eng = E[p.type]($('.engine'), p, api); } catch (e) { console.error(e); $('.engine').innerHTML = '<p class="xl-flash">Este ejercicio no pudo cargarse. Usa “Empezar de nuevo”.</p>'; }
    /* intentos: cada ejercicio permite MAXT revisiones y se conserva la calificación más alta */
    const used = () => (store.prog[pid] && store.prog[pid].att) || 0;
    const bestPct = () => Math.round(((store.prog[pid] && store.prog[pid].best) || 0) * 100);
    const showSol = () => { if ($('.sol-box') || bestPct() >= 100) return; let h = ''; try { h = solutionHTML(p); } catch (e) { console.error(e); } if (!h) return; $('.result').insertAdjacentHTML('afterend', `<details class="sol-box" open><summary>✅ Respuestas correctas</summary><p class="sol-note">Ya usaste tus 3 intentos. Compara con tu trabajo para ver qué te faltó; tu calificación se queda en ${bestPct()}%.</p>${h}</details>`); };
    const showAtt = () => {
      const u = used(), left = MAXT - u; const a = $('.att');
      if (u >= MAXT) { a.innerHTML = `<b>Intentos agotados.</b> Calificación: <b>${bestPct()}%</b>`; $('#chk').disabled = true; $('#rst').disabled = true; $('.engine').classList.add('locked'); showSol(); }
      else a.innerHTML = u ? `Te ${left === 1 ? 'queda' : 'quedan'} <b>${left}</b> de ${MAXT} intentos · Calificación más alta: <b>${bestPct()}%</b>` : `Tienes <b>${MAXT} intentos</b> para revisar este ejercicio`;
    };
    const record = (score) => { const pr = store.prog[pid] || { best: 0, tries: 0 }; pr.tries++; pr.att = (pr.att || 0) + 1; if (pr.first == null) pr.first = score; pr.best = Math.max(pr.best, score); store.prog[pid] = pr; persist();
      if (!REPORT_URL) return; syncAll(); const res = $('.result');
      report([rowFor(x, score, 'Revisión')]).then((ok) => { if (!document.body.contains(res) || !res.firstChild) return; const n = document.createElement('p'); n.className = 'sent muted small'; n.textContent = ok ? '✓ Tu calificación se envió a tu maestra o maestro.' : 'Sin conexión: tu calificación se enviará sola cuando vuelvas a tener internet.'; res.appendChild(n); }); };
    /* lista de lo que el alumno debe corregir (a partir de lo marcado en rojo en el ejercicio) */
    const failList = () => {
      const eng0 = $('.engine'); if (!eng0) return '';
      let els = $$('.bad', eng0).filter((el) => !el.matches('.ord-set') && !(el.parentElement && el.parentElement.closest('.bad:not(.ord-set)')));
      els = els.concat($$('ul.rules li:not(.on), .ed-rules li:not(.on), .py-rules li:not(.on)', eng0), p.type === 'form' ? $$('.fld[data-i]:not(.ok)', eng0) : []);
      if (!els.length) return '';
      const txt = (el, sel) => { const x = sel ? el.querySelector(sel) : el; return x ? x.textContent.replace('⠿', '').replace(/\s+/g, ' ').trim() : ''; };
      const items = els.slice(0, 10).map((el, i) => {
        let lab = txt(el, '.cls-text') || txt(el, 'legend') || txt(el, '.tk-t') || txt(el, '.tr-q p') || txt(el, '.bin-q') || txt(el, '.ord-t') || txt(el, '.lv-goal') || txt(el, '.ord-prompt') || (el.matches('.fld') ? txt(el, 'span') : '') || txt(el);
        if (el.matches('.spot')) lab = `Marcaste «${lab}», pero no es un error`;
        if (el.matches('.ord li')) lab = `«${lab}» no está en su lugar`;
        const fb = txt(el, '.cls-fb') || txt(el, '.q-fb') || txt(el, '.tk-h');
        el.dataset.fail = i;
        return `<li><button type="button" class="lnk" data-go="${i}">${esc(lab.slice(0, 140))}</button>${fb ? ` <span class="muted">— ${esc(fb.slice(0, 160))}</span>` : ''}</li>`;
      });
      return `<div class="fails"><p><b>❌ Lo que debes corregir${els.length > 1 ? ` (${els.length})` : ''}:</b> <span class="muted small">toca cada punto para ir a él.</span></p><ol>${items.join('')}</ol>${els.length > 10 ? `<p class="muted small">…y ${els.length - 10} más, marcados en rojo arriba.</p>` : ''}</div>`;
    };
    if (!window.__failNav) window.__failNav = $('#main').addEventListener('click', (e) => { const b = e.target.closest('.fails [data-go]'); if (!b) return; const el = $(`.engine [data-fail="${b.dataset.go}"]`); if (!el) return; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }) || true;
    let busy = false;
    async function doCheck() {
      if (!eng || busy || used() >= MAXT) return;
      if (REPORT_URL && !registered()) { $('.result').innerHTML = '<div class="res res-mid"><span>Antes de revisar, escribe arriba tu <b>nombre y apellidos</b> y tu <b>grupo</b> (por ejemplo 502). Así tu calificación le llega a tu maestra o maestro. Este intento no se contó.</span></div>'; const f = !store.name.trim() || store.name.trim().length < 3 ? $('#who') : $('#grp'); if (f) { f.classList.add('need'); f.focus(); setTimeout(() => f.classList.remove('need'), 2500); } return; }
      if (tm.t.reto && (store.exp[pid] || '').trim().length < 60) { $('.result').innerHTML = '<div class="res res-mid"><span>Antes de revisar, escribe en el recuadro <b>✍️ cómo resolviste el reto</b> (mínimo 60 caracteres). Este intento no se contó.</span></div>'; const t = $('#exp'); if (t) { t.classList.add('need'); t.focus(); setTimeout(() => t.classList.remove('need'), 2500); } return; }
      let r = eng.check();
      if (r && typeof r.then === 'function') { busy = true; const btn = $('#chk'); btn.disabled = true; $('.result').innerHTML = '<span class="muted">Revisando…</span>'; try { r = await r; } catch (e) { r = { score: 0, msg: 'No se pudo revisar. Intenta de nuevo.', noCount: true }; } busy = false; btn.disabled = false;
        if (r.noCount) { $('.result').innerHTML = `<div class="res res-bad"><span>${esc(r.msg)} Este intento no se contó.</span></div>`; return; }
        if (!document.body.contains(btn)) { record(r.score); return; } }
      if (r.incomplete) { $$('.engine .ok, .engine .bad').forEach((el) => el.classList.remove('ok', 'bad')); $$('.engine .cls-fb, .engine .q-fb').forEach((el) => { el.textContent = ''; }); $('.result').innerHTML = `<div class="res res-mid"><span>${esc(r.msg)} Complétalo antes de revisar: <span style="font-weight:700">este intento no se contó</span>.</span></div>`; return; }
      record(r.score);
      const pct = Math.round(r.score * 100); const lvl = r.score >= 1 ? 'ok' : r.score >= 0.8 ? 'mid' : 'bad'; const left = MAXT - used();
      const extra = r.score >= 1 ? '' : left > 0 ? ` Corrige lo marcado en rojo y vuelve a revisar: te ${left === 1 ? 'queda 1 intento' : `quedan ${left} intentos`}.` : ' Ya usaste tus 3 intentos.';
      $('.result').innerHTML = `<div class="res res-${lvl}"><b>${pct}%</b><span>${r.score >= 1 ? '¡Dominado! ' : r.score >= 0.8 ? 'Completado. ' : ''}${esc(r.msg)}${extra} Se guarda tu calificación más alta: <span style="font-weight:700">${bestPct()}%</span>.</span></div>${r.score < 1 ? failList() : ''}${(bestPct() >= 80 || left <= 0) && next ? `<a class="btn primary" href="#${next.pid}">${nextLabel}</a>` : ''}`;
      markDay(); if (r.score >= 1) confetti(); checkBadges();
      showAtt();
      side(tm.tid); $$('.extab').forEach((el) => { const e = byPid[el.getAttribute('href').slice(1)]; el.className = 'extab st-' + status(e.pid); el.querySelector('.exl').textContent = e.label + (stIcon[status(e.pid)] ? ' ' + stIcon[status(e.pid)] : ''); });
    }
    $('#chk').addEventListener('click', () => doCheck());
    showAtt();
    if (best && best.att) {
      let fl = '';
      if (eng && p.type !== 'python' && best.best < 1) { try { const rr = eng.check(); if (rr && typeof rr.then !== 'function' && !rr.incomplete) fl = failList(); } catch (e) { /* */ } }
      $('.result').innerHTML = `<span class="muted">Calificación más alta en este ejercicio: <b>${Math.round(best.best * 100)}%</b> (${best.att} de ${MAXT} intentos usados).${fl ? ' Así quedó tu última revisión:' : ''}</span>${fl}`;
    }
    $('#rst').addEventListener('click', (e) => { const b = e.currentTarget; if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = '¿Seguro? Se borra tu trabajo, no tus intentos'; b.classList.add('warn'); clearTimeout(b._t); b._t = setTimeout(() => { delete b.dataset.sure; b.textContent = 'Empezar de nuevo'; b.classList.remove('warn'); }, 5000); return; } delete store.saves[pid]; persist(); practice(pid); });
    $('#main').focus({ preventScroll: true }); window.scrollTo(0, 0);
  }
  let curHash = location.hash.slice(1);
  function route(force) {
    let h = typeof force === 'string' ? force : location.hash.slice(1); curHash = h;
    if (byTid[h]) h = byTid[h].ex[0].pid;
    document.body.classList.toggle('in-prac', !!byPid[h]);
    if (h === 'logros') { logros(); return; } const rmx = h.match(/^rapido-(\d+)$/); if (rmx) { rapid(+rmx[1] - 1); return; }
    if (byPid[h]) practice(h); else home();
  }
  /* navegación interna: funciona aunque la página esté incrustada en Google Sites con restricciones */
  function go(h) { try { if (location.hash.slice(1) !== h) history.pushState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { /* sin historial: se navega igual */ } route(h); }
  document.addEventListener('click', (e) => { const a = e.target.closest('a[href^="#"]'); if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return; e.preventDefault(); go(a.getAttribute('href').slice(1)); });
  shell(); markDay(); checkBadges(true); window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== curHash) route(); }); window.addEventListener('popstate', () => { if (location.hash.slice(1) !== curHash) route(); }); route();
})();
