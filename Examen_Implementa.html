<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen · Implementa aplicaciones web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--vino:#6E1F33;--vino2:#A13546;--oro:#C9A15A;--tinta:#1F2328;--gris:#5A6270;--linea:#D9DDE3;--fondo:#F4F5F7;--ok:#1B7A43;--mal:#B42318;--azul:#1D5FD1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{background:var(--vino);color:#fff;padding:14px 18px}
header h1{margin:0;font-size:1.15rem;font-weight:800}
header p{margin:2px 0 0;opacity:.85;font-size:.85rem}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:20px;margin:0 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{margin:0 0 10px;font-size:1.3rem;color:var(--vino)}
label.f{display:block;margin:0 0 12px}
label.f span{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
input[type=text],input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--linea);border-radius:10px;background:#fff}
input:focus{outline:none;border-color:var(--vino2);box-shadow:0 0 0 3px rgba(161,53,70,.15)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#E7E9ED;color:var(--tinta)}
.btn.p{background:var(--vino);color:#fff}.btn.p:hover{background:var(--vino2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{margin:10px 0 0;font-weight:600}.msg.err{color:var(--mal)}.msg.ok{color:var(--ok)}
ul.reglas{margin:6px 0 0;padding-left:20px}ul.reglas li{margin:4px 0}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--linea);padding:10px 16px}
.top .in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.bar{height:6px;background:#E7E9ED;border-radius:6px;overflow:hidden;margin-top:6px;width:100%}.bar i{display:block;height:100%;background:var(--oro)}
.qn{font-size:.8rem;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.qt{font-size:1.05rem;margin:0 0 14px;user-select:none;-webkit-user-select:none}
.qt b{color:var(--vino)}
pre.code{background:#111827;color:#E5E7EB;padding:12px 14px;border-radius:10px;overflow:auto;font:13.5px/1.5 ui-monospace,Consolas,monospace;margin:10px 0;white-space:pre}
code{background:#EEF0F3;padding:1px 5px;border-radius:5px;font:.9em ui-monospace,Consolas,monospace}
.tbl{overflow:auto;margin:10px 0}table{border-collapse:collapse;font-size:.92rem}th,td{border:1px solid var(--linea);padding:6px 10px;text-align:left}th{background:#F1EDEE}
.doc{background:#FBFAF8;border:1px solid var(--linea);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.opts{display:grid;gap:8px;margin:6px 0 0;user-select:none;-webkit-user-select:none}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--linea);border-radius:10px;padding:11px 12px;cursor:pointer;background:#fff}
.opt:hover{border-color:#B9BEC7}.opt input{margin-top:4px;accent-color:var(--vino)}
.opt.on{border-color:var(--vino);background:#FBF3F5}
.sub{font-weight:800;color:var(--vino);margin:16px 0 4px;font-size:.95rem}
.ans input{max-width:420px}.ans small{display:block;color:var(--gris);margin-top:4px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.mapa button{font:inherit;font-size:.82rem;font-weight:700;border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:7px 0;cursor:pointer}
.mapa button.r{background:#E9F5EE;border-color:#9CD3B1}.mapa button.cur{border-color:var(--vino);box-shadow:0 0 0 2px rgba(110,31,51,.25)}
.aviso{background:#FFF4E5;border:1px solid #F5C26B;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:.92rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:520px;width:100%}
.res{text-align:center}.res .big{font-size:3.6rem;font-weight:800;color:var(--vino);line-height:1;margin:8px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1F2328;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90vw}
.muted{color:var(--gris)}.small{font-size:.85rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Examen del segundo parcial · Implementa aplicaciones web</h1><p>CECyTEM Plantel Metepec II · Técnico en Programación</p></header>
<div id="app"></div>
<script>
/* Examen del segundo parcial · Implementa aplicaciones web (sistema de control escolar)
   Mismo formato que bank_construye.js */
(() => {
const c = (t) => `<pre class="code">${String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`;
const k = (t) => `<code>${String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;')}</code>`;
const tabla = (h, rows) => `<div class="tbl"><table><tr>${h.map((x) => `<th>${x}</th>`).join('')}</tr>${rows.map((r) => `<tr>${r.map((x) => `<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
const r1 = (x) => Math.round(x * 10) / 10;
const rx = (t) => String(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const TURNO = { 'Crítica|Alta': 1, 'Crítica|Media': 2, 'Crítica|Baja': 4, 'Media|Alta': 3, 'Media|Media': 5, 'Media|Baja': 7, 'Baja|Alta': 6, 'Baja|Media': 8, 'Baja|Baja': 9 };
const MATRIZ = tabla(['Severidad \\ Prioridad', 'Alta', 'Media', 'Baja'], [['Crítica', '1', '2', '4'], ['Media', '3', '5', '7'], ['Baja', '6', '8', '9']]);

window.EXAMEN = {
  materia: 'Implementa',
  titulo: 'Implementa aplicaciones web',
  temas: { A: 'Herramientas de desarrollador', B: 'Pruebas de carga y estrés', C: 'Registro de defectos', D: 'Clasificación de defectos', E: 'Corrección de código y convenciones', F: 'Reflexión socioemocional' },
  preguntas: [
  /* ================= A. Herramientas de desarrollador ================= */
  { t: 'A', gen: (K) => { const alto = K.r() < 0.5; const ttfb = alto ? K.int(1800, 2600) : K.int(60, 180), load = alto ? ttfb + K.int(400, 900) : K.int(3400, 5200);
    return { q: `Mediste /alumnos/: <b>TTFB = ${ttfb} ms</b> y <b>Load = ${(load / 1000).toFixed(1)} s</b>. ¿Dónde está el problema principal?`, opts: alto ? ['En el servidor o la consulta a MySQL: tarda mucho en empezar a responder', 'En imágenes o CSS muy pesados', 'En el código de estado 200', 'No hay ningún problema'] : ['En archivos pesados, como imágenes o CSS: el servidor responde rápido', 'En el servidor o la consulta a MySQL', 'En el código de estado 200', 'No hay ningún problema'] }; } },
  { t: 'A', gen: (K) => { const img = K.pick(['escudo.png', 'fondo_escuela.jpg', 'banner.png']), kb = K.int(300, 900), falla = K.pick(['buscador.js', 'menu.js', 'logo.svg']);
    const rows = [['alumnos/', '200', 'document', `${K.int(6, 14)}.${K.int(0, 9)} kB`, `${K.int(150, 700)} ms`], ['estilos.css', '200', 'stylesheet', `${K.int(3, 9)}.${K.int(0, 9)} kB`, `${K.int(20, 80)} ms`], [img, '200', 'png', `${kb} kB`, `${K.int(200, 700)} ms`], [falla, '404', 'script', '0.4 kB', `${K.int(10, 40)} ms`]];
    return { q: `Así se ve la pestaña Network al medir la lista de alumnos:${tabla(['Name', 'Status', 'Type', 'Size', 'Time'], K.mix(rows))}¿Qué recurso no se encontró en el servidor?`, opts: [`${falla} (404)`, img, 'alumnos/', 'estilos.css'] }; } },
  { t: 'A', gen: (K) => { const load = K.int(18, 48) / 10, dcl = r1(load * 0.6), ok = load < 3;
    return { q: `Barra inferior de Network: <b>${K.int(9, 25)} requests · ${K.int(200, 900)} kB · DOMContentLoaded: ${dcl} s · Load: ${load} s</b>. El requisito es que la página cargue en menos de 3 s. ¿Cumple y por qué?`, opts: ok ? ['Sí cumple', 'No cumple'] : ['No cumple', 'Sí cumple'], why: [`Se compara el Load (${load} s) con los 3 s del requisito.`, `Se compara el DOMContentLoaded (${dcl} s) con el requisito.`, 'Se compara el número de requests con 3.', 'Se compara el peso en kB con 3 000.'] }; } },
  { t: 'A', gen: (K) => ({ q: 'Un compañero midió la lista de alumnos y obtuvo tiempos muy bajos, mucho menores que los del resto del equipo. ¿Qué le faltó hacer?', opts: ['Marcar «Disable cache» y recargar con Ctrl + F5', 'Cerrar el navegador', 'Medir con el celular apagado', 'Subir la concurrencia a 50'] }) },
  { t: 'A', gen: (K) => { const v = [K.int(10, 30), K.int(10, 30), K.int(10, 30)].map((x) => x / 10); const p = r1((v[0] + v[1] + v[2]) / 3);
    return { q: `Mediste tres veces el Load del formulario de nuevo alumno: <b>${v.join(' s, ')} s</b>. ¿Qué valor anotas en la bitácora como promedio? (un decimal, en segundos)`, num: p, tol: 0.1, unit: 's' }; } },
  { t: 'A', gen: (K) => { const C = [['No throttling', K.int(9, 15) / 10], ['Fast 4G', K.int(18, 28) / 10], ['Slow 4G', K.int(31, 45) / 10], ['3G', K.int(50, 70) / 10]];
    return { q: `Bitácora de la página /alumnos/ con distintas conexiones:${tabla(['Conexión', 'Load'], C.map((x) => [x[0], x[1] + ' s']))}¿Con qué conexiones NO se cumple el requisito de 3 s?`, opts: ['Slow 4G y 3G', 'Solo 3G', 'Todas', 'Ninguna'] }; } },
  { t: 'A', gen: (K) => { const O = [['La tabla de alumnos obliga a desplazar toda la página hacia los lados', 1], ['Los botones Guardar y Cancelar se pueden tocar con el dedo', 0], ['El botón Nuevo alumno queda cortado a la derecha', 1], ['El formulario se acomoda en una sola columna', 0], ['Los enlaces de la tabla están tan juntos que se toca el equivocado', 1]];
    const o = K.pick(O); return { q: `Revisas el sistema en modo dispositivo a 375 px de ancho: <b>«${o[0]}»</b>. ¿Cumple o no cumple?`, opts: [['Cumple', 'No cumple'][o[1]], ['Cumple', 'No cumple'][1 - o[1]]] }; } },
  { t: 'A', gen: (K) => ({ q: 'Abriste F12 después de que la página ya había cargado y la pestaña Network está vacía. ¿Qué haces?', opts: ['Con Network abierta, recargar la página (Ctrl + F5)', 'Cerrar F12 y volver a abrirlo sin recargar', 'Activar el modo celular', 'Reiniciar XAMPP'] }) },
  { t: 'A', gen: (K) => { const p = K.pick(['/alumnos/', '/alumnos/nuevo/', '/login/']);
    return { q: `Para tu bitácora necesitas el TTFB de ${p}. ¿Dónde lo encuentras?`, opts: ['En la pestaña Timing de la primera petición, en «Waiting for server response»', 'En la columna Size', 'En la consola de JavaScript', 'En el código fuente de la página'] }; } },

  /* ================= B. Pruebas de carga y estrés ================= */
  { t: 'B', gen: (K) => { const S = [['GET a /alumnos/ sin iniciar sesión', '302 Found'], [`GET a /alumnos/${K.int(90000, 99999)}/ (alumno que no existe)`, '404 Not Found'], ['Enviar el formulario por POST sin el token CSRF', '403 Forbidden'], ['Una excepción sin manejar en el código de la vista', '500 Internal Server Error'], ['GET a /login/', '200 OK']];
    const C = ['200 OK', '302 Found', '403 Forbidden', '404 Not Found', '500 Internal Server Error'];
    const s = K.pick(S); return { q: `En Postman envías: <b>${s[0]}</b>. ¿Qué código esperas?`, opts: [s[1], ...K.some(C.filter((x) => x !== s[1]), 3)] }; } },
  { t: 'B', gen: (K) => { const a = K.pick([['registrar un alumno nuevo desde el formulario', 'POST'], ['consultar la lista de alumnos', 'GET'], ['ver el detalle del alumno con matrícula ' + K.int(1000, 9999), 'GET']]);
    return { q: `¿Qué método HTTP corresponde a <b>${a[0]}</b>?`, opts: [a[1], ...['GET', 'POST', 'DELETE', 'PUT'].filter((x) => x !== a[1]).slice(0, 3)] }; } },
  { t: 'B', gen: (K) => { const cod = K.pick([['500', 'del servidor: falló el código de la aplicación'], ['404', 'del cliente: pidió algo que no existe'], ['403', 'del cliente: no tiene permiso'], ['400', 'del cliente: la petición está mal formada']]);
    return { q: `Una prueba devuelve el código <b>${cod[0]}</b>. ¿De quién es el error?`, opts: [cod[1].charAt(0).toUpperCase() + cod[1].slice(1), ...['Es una respuesta exitosa', 'Es una redirección al login', cod[0] === '500' ? 'Del cliente: pidió algo que no existe' : 'Del servidor: falló el código de la aplicación']] }; } },
  { t: 'B', gen: (K) => { const n = K.pick([100, 200, 300, 500]), cc = K.pick([5, 10, 20, 25]), p = K.pick(['login/', 'alumnos/']);
    return { q: `Ya estás en C:\\xampp\\apache\\bin. Escribe el comando de Apache Bench que envía <b>${n}</b> peticiones en total, <b>${cc}</b> al mismo tiempo, a <b>http://127.0.0.1:8000/${p}</b>.`, txt: [new RegExp(`^ab(\\.exe)? (-n ${n} -c ${cc}|-c ${cc} -n ${n}) http://(127\\.0\\.0\\.1|localhost):8000/${rx(p)}$`, 'i')], sol: `ab -n ${n} -c ${cc} http://127.0.0.1:8000/${p}`, ph: 'ab …' }; } },
  { t: 'B', gen: (K) => { const n = K.pick([150, 250, 400]), cc = K.pick([15, 30, 40]);
    return { q: `¿Qué significa ${k(`ab -n ${n} -c ${cc} http://127.0.0.1:8000/login/`)}?`, opts: [`${n} peticiones en total, ${cc} al mismo tiempo`, `${n} usuarios durante ${cc} segundos`, `${n} segundos y ${cc} errores permitidos`, `${cc} peticiones en total, ${n} al mismo tiempo`] }; } },
  { t: 'B', gen: (K) => { const cs = [10, 25, 50, 75]; const lim = K.int(1, 3); let rps = K.int(30, 40);
    const rows = cs.map((x, i) => { rps = r1(rps * (0.7 + K.r() * 0.15)); return [`ab -n 200 -c ${x}`, String(rps), i >= lim ? String(K.int(4, 30)) : '0']; });
    return { q: `Resultados de la prueba de estrés de tu equipo:${tabla(['Comando', 'Requests per second', 'Failed requests'], rows)}¿En qué concurrencia empieza la señal de alerta y por qué?`, opts: [`-c ${cs[lim]}`, ...cs.filter((x, i) => i !== lim).map((x) => `-c ${x}`).slice(0, 3)], why: ['Es la primera en la que aparecen peticiones fallidas (Failed requests mayor que 0).', 'Es la que tiene más peticiones por segundo.', 'Siempre se elige la concurrencia más alta.', 'Es la primera fila de la tabla.'] }; } },
  { t: 'B', gen: (K) => { const a = K.int(30, 40), b = r1(a * 0.55);
    return { q: `Al subir la concurrencia, «Requests per second» bajó de <b>${a}</b> a <b>${b}</b>. ¿Qué indica?`, opts: ['Que el servidor atiende menos peticiones por segundo: se está degradando', 'Que el servidor se volvió más rápido', 'Que hubo menos usuarios', 'Nada: es normal y no se reporta'] }; } },
  { t: 'B', gen: (K) => ({ q: 'El Collection Runner de Postman ejecutó 200 iteraciones de la colección «Control escolar». ¿Por qué se considera una prueba de carga y no de estrés?', opts: ['Porque envía las peticiones una tras otra, no muchas al mismo tiempo', 'Porque Postman es gratuito', 'Porque mide el TTFB', 'Porque solo usa el método GET'] }) },
  { t: 'B', gen: (K) => { const ms = K.int(1200, 4200);
    return { q: `En la pestaña Tests tienes:${c('pm.test("Responde en menos de 3 s", () => {\n  pm.expect(pm.response.responseTime).to.be.below(3000);\n});')}La petición tardó <b>${ms} ms</b>. ¿Qué resultado muestra Postman?`, opts: ms < 3000 ? ['PASS', 'FAIL', 'Error de sintaxis', 'Could not send request'] : ['FAIL', 'PASS', 'Error de sintaxis', 'Could not send request'] }; } },

  /* ================= C. Registro de defectos ================= */
  { t: 'C', gen: (K) => { const E = ['Nuevo', 'Asignado', 'En corrección', 'Corregido', 'Verificado', 'Cerrado']; const i = K.int(0, 4);
    return { q: `En el ciclo de vida de un defecto, ¿qué estado sigue a <b>«${E[i]}»</b>?`, opts: [E[i + 1], ...K.some(E.filter((x, j) => j !== i + 1 && j !== i), 3)] }; } },
  { t: 'C', gen: (K) => { const n = K.int(2, 30);
    return { q: `La incidencia #${n} estaba en «Corregido». Al verificarla, el defecto vuelve a aparecer. ¿A qué estado regresa?`, opts: ['En corrección', 'Nuevo', 'Cerrado', 'Se borra la incidencia'] }; } },
  { t: 'C', gen: (K) => ({ q: 'En tu equipo, ¿por qué quien corrige un defecto no debe ser quien lo verifica?', opts: ['Para que otra persona confirme que de verdad quedó corregido', 'Porque así lo exige GitHub', 'Porque quien corrige ya no tiene tiempo', 'No importa quién lo verifique'], why: ['Quien corrigió tiende a probar solo lo que cambió y puede dar por buena una corrección incompleta.', 'GitHub bloquea al autor del commit.', 'Así cada quien trabaja menos.', 'La verificación solo es un trámite.'] }) },
  { t: 'C', gen: (K) => { const d = K.pick([['Nuevo alumno acepta fecha de nacimiento futura', 'el formulario de nuevo alumno'], ['La búsqueda no encuentra apellidos con acento', 'la búsqueda de alumnos'], ['Editar un alumno borra su matrícula', 'la edición de alumnos']]);
    return { q: `Encontraste un defecto en ${d[1]}. ¿Cuál es el mejor título para la incidencia?`, opts: [d[0], 'No sirve el sistema', 'Error!!!', 'Problema con alumnos'] }; } },
  { t: 'C', gen: (K) => { const F = [['Pasos', '1. Abrir /alumnos/nuevo/ 2. Escribir fecha 2031-01-01 3. Guardar'], ['Resultado esperado', 'Mensaje: la fecha no puede ser futura'], ['Resultado obtenido', 'El alumno se guarda con fecha 2031'], ['Evidencia', 'captura_fecha_futura.png']];
    const i = K.int(0, 3); const doc = F.map((f, j) => `<b>${f[0]}:</b> ${j === i ? '<i>(vacío)</i>' : f[1]}`).join('<br>');
    return { q: `Revisa esta incidencia:<div class="doc"><b>Título:</b> Nuevo alumno acepta fecha de nacimiento futura<br>${doc}</div>¿Qué le falta para que otra persona pueda entenderla y repetirla?`, opts: [F[i][0], ...F.filter((x, j) => j !== i).map((x) => x[0])] }; } },
  { t: 'C', gen: (K) => ({ q: '¿Qué hace que un reporte de defecto sea <b>reproducible</b>?', opts: ['Que cualquier persona pueda provocar el defecto siguiendo los pasos escritos', 'Que tenga muchas palabras', 'Que lo escriba el docente', 'Que tenga capturas de colores'] }) },
  { t: 'C', gen: (K) => { const n = K.int(2, 40);
    return { q: `Corregiste la incidencia <b>#${n}</b> en GitHub. Escribe el texto que pones en el mensaje del commit para que GitHub la cierre sola al integrarlo.`, txt: [new RegExp(`^(fixes|fix|fixed|closes|close|closed|resolves|resolve|resolved) #${n}\\.?$`, 'i')], sol: `Fixes #${n}`, ph: 'palabra clave y número' }; } },
  { t: 'C', gen: (K) => ({ q: 'Para encontrar defectos en la Actividad 6, ¿qué conviene probar en el formulario de nuevo alumno?', opts: ['Campos vacíos, datos inválidos, fechas futuras y matrículas repetidas', 'Solo datos correctos', 'Solo el color de los botones', 'Nada: si se ve bien, funciona'] }) },
  { t: 'C', gen: (K) => ({ q: 'En Trello, ¿qué listas lleva el tablero «Defectos · Control escolar»?', opts: ['Nuevo, Asignado, En corrección, Corregido y Verificado', 'Lunes, Martes y Miércoles', 'Bueno, Malo y Regular', 'Solo «Pendientes»'] }) },

  /* ================= D. Clasificación de defectos ================= */
  { t: 'D', gen: (K) => { const S = [['La decide quien prueba, según el impacto técnico', 'Severidad'], ['La decide el jefe inmediato, según la urgencia', 'Prioridad'], ['Responde a «¿se pierden datos?»', 'Severidad'], ['Responde a «¿hay una entrega cerca?»', 'Prioridad'], ['Responde a «¿se bloquea una función?»', 'Severidad'], ['Responde a «¿lo ven los usuarios hoy?»', 'Prioridad']];
    const s = K.pick(S); return { q: `<b>«${s[0]}»</b>. ¿Se refiere a la severidad o a la prioridad?`, opts: [s[1], s[1] === 'Severidad' ? 'Prioridad' : 'Severidad'] }; } },
  { t: 'D', gen: (K) => { const G = [['Nadie puede iniciar sesión', 'Crítico'], ['Eliminar un alumno borra a otro', 'Crítico'], ['Se ven datos de alumnos sin iniciar sesión', 'Crítico'], ['Acepta fecha de nacimiento futura', 'Medio'], ['La búsqueda no encuentra apellidos con acento', 'Medio'], ['Una página tarda más de 3 s', 'Medio'], ['Botón desalineado a 375 px', 'Bajo'], ['Error de ortografía en un título', 'Bajo']];

    if (!s.abierto && !(prev && !prev.done && prev.intento > (s.anulados || 0))) { m.textContent = 'El examen todavía no está abierto. Espera la indicación de tu maestra.'; return; }
    if (prev && !prev.done && prev.intento > (s.anulados || 0)) { st = prev; } /* continúa donde se quedó */
    else st = { mat, ap, am, nom, grp, intento: (s.anulados || 0) + 1, inicio: Date.now(), ans: {}, cur: 0, salidas: 0, pegar: 0, done: null };
    save(); examen();
  });
}
/* vista previa para la maestra (no se guarda en la hoja) */
function docente() {
  const m = $('#rmsg'); m.className = 'msg';
  m.innerHTML = 'Vista previa docente: escribe tu contraseña. <input type="password" id="dclave" style="max-width:220px;margin-top:6px"> <button class="btn p" id="dgo">Ver examen</button>';
  $('#dgo').addEventListener('click', async () => { const cl = $('#dclave').value; let d = null; try { d = await getJSON(`accion=checkclave&clave=${encodeURIComponent(cl)}`); } catch (e) {}
    if (!d || !d.checked) { m.className = 'msg err'; m.textContent = 'No se pudo comprobar la contraseña (revisa internet o que el Apps Script esté actualizado).'; return; }
    if (d.sin) { m.className = 'msg err'; m.textContent = 'Todavía no hay contraseña docente. Créala en el simulador con el botón 🔒 Docente y vuelve a intentarlo.'; return; }
    if (!d.ok) { m.className = 'msg err'; m.textContent = 'Contraseña incorrecta.'; return; }
    st = { mat: 'DOCENTE-' + Math.floor(Math.random() * 1e6), ap: 'VISTA', am: 'PREVIA', nom: 'DOCENTE', grp: '-', intento: 1, inicio: Date.now(), ans: {}, cur: 0, salidas: 0, pegar: 0, done: null, previa: true };
    examen(); });
}

/* ================= 2. Examen ================= */
let P = null;
function examen() {
  P = armar(st);
  app.innerHTML = `<div class="top"><div class="in"><span><b>${esc(st.nom)} ${esc(st.ap)} ${esc(st.am)}</b> · ${esc(st.mat)}${st.previa ? ' · <b style="color:var(--mal)">VISTA PREVIA DOCENTE: no se guarda</b>' : ''}</span><span id="cnt"></span><div class="bar"><i id="barra"></i></div></div></div>
    <main><div class="aviso" id="sal" hidden></div><div class="card" id="q"></div>
    <div class="card"><p class="qn">Mapa de preguntas</p><div class="mapa" id="mapa"></div>
    <div class="row" style="margin-top:14px"><button class="btn p" id="entregar">Entregar examen</button><span class="muted small">Revisa que hayas contestado todo antes de entregar.</span></div></div></main>`;
  pinta(); $('#entregar').addEventListener('click', confirmar);
}
const cuenta = () => P.filter((p) => respondida(p, st.ans[p.i])).length;
function pinta() {
  const k = st.cur, p = P[k], a = st.ans[p.i] || {};
  let h = `<p class="qn">Pregunta ${k + 1} de ${NPREG} · ${esc(EX.temas[p.t])}</p><div class="qt">${p.q}</div>`;
  if (p.tipo === 'mc' || p.tipo === 'mr') {
    if (p.tipo === 'mr') h += '<p class="sub">Tu respuesta:</p>';
    h += `<div class="opts">${p.ord.map((j) => `<label class="opt${a.o === j ? ' on' : ''}"><input type="radio" name="o" value="${j}" ${a.o === j ? 'checked' : ''}><span>${esc(p.opts[j])}</span></label>`).join('')}</div>`;
    if (p.tipo === 'mr') h += `<p class="sub">¿Por qué?</p><div class="opts">${p.word.map((j) => `<label class="opt${a.w === j ? ' on' : ''}"><input type="radio" name="w" value="${j}" ${a.w === j ? 'checked' : ''}><span>${esc(p.why[j])}</span></label>`).join('')}</div><p class="muted small">Vale medio punto la respuesta y medio punto la razón.</p>`;
  } else {
    h += `<div class="ans"><input type="text" id="v" value="${esc(a.v || '')}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(p.tipo === 'num' ? 'Escribe solo el número' : p.ph)}" ${p.tipo === 'num' ? 'inputmode="decimal"' : ''}>${p.tipo === 'num' && p.unit ? ` <b>${esc(p.unit)}</b>` : ''}<small>${p.tipo === 'num' ? 'Escribe el resultado; usa punto decimal si hace falta.' : 'Escríbelo tal como lo teclearías en la terminal o en el código.'}</small></div>`;
  }
  h += `<div class="nav"><button class="btn" id="ant" ${k === 0 ? 'disabled' : ''}>← Anterior</button><button class="btn p" id="sig">${k === NPREG - 1 ? 'Ir a entregar' : 'Siguiente →'}</button></div>`;
  $('#q').innerHTML = h;
  $('#q').querySelectorAll('input[type=radio]').forEach((r) => r.addEventListener('change', () => { const x = st.ans[p.i] = st.ans[p.i] || {}; x[r.name] = +r.value; save(); pinta(); }));
  const v = $('#v'); if (v) { v.addEventListener('input', () => { (st.ans[p.i] = st.ans[p.i] || {}).v = v.value.slice(0, 200); save(); barra(); }); v.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#sig').click(); }); }
  $('#ant').addEventListener('click', () => { st.cur--; save(); pinta(); window.scrollTo(0, 0); });
  $('#sig').addEventListener('click', () => { if (k === NPREG - 1) { $('#entregar').scrollIntoView({ behavior: 'smooth' }); return; } st.cur++; save(); pinta(); window.scrollTo(0, 0); });
  $('#mapa').innerHTML = P.map((x, j) => `<button class="${respondida(x, st.ans[x.i]) ? 'r' : ''}${j === k ? ' cur' : ''}" data-j="${j}">${j + 1}</button>`).join('');
  $('#mapa').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { st.cur = +b.dataset.j; save(); pinta(); window.scrollTo(0, 0); }));
  barra();
}
function barra() { const n = cuenta(); $('#cnt').textContent = `Respondidas: ${n} de ${NPREG}`; $('#barra').style.width = `${n / NPREG * 100}%`;
  const b = $(`#mapa button[data-j="${st.cur}"]`); if (b) b.classList.toggle('r', respondida(P[st.cur], st.ans[P[st.cur].i])); }
function confirmar() {
  const falt = P.map((p, j) => (respondida(p, st.ans[p.i]) ? 0 : j + 1)).filter(Boolean);
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="card"><h2>¿Entregar el examen?</h2>${falt.length ? `<p>Te faltan <b>${falt.length}</b> pregunta(s): ${falt.slice(0, 20).join(', ')}${falt.length > 20 ? '…' : ''}. Las preguntas sin responder cuentan como incorrectas.</p>` : '<p>Respondiste todas las preguntas.</p>'}<p><b>Ya no podrás cambiar tus respuestas.</b></p><div class="row"><button class="btn p" id="si">Sí, entregar</button><button class="btn" id="no">Seguir revisando</button></div></div>`;
  document.body.appendChild(d); $('#no', d).addEventListener('click', () => d.remove());
  $('#si', d).addEventListener('click', () => { d.remove(); calificar(); });
}
function calificar() {
  const porTema = {}; let tot = 0, sin = 0; const det = [];
  P.forEach((p) => { const pt = puntos(p, st.ans[p.i]); tot += pt; if (!respondida(p, st.ans[p.i])) sin++;
    const t = porTema[p.t] = porTema[p.t] || { p: 0, n: 0 }; t.p += pt; t.n++; det.push([p.i + 1, pt]); });
  det.sort((a, b) => a[0] - b[0]);
  const calif = Math.round(tot / NPREG * 100) / 10;
  st.done = { calif, aciertos: tot, porTema, sin, det, fin: Date.now() }; save(); resultado(); enviar();
}

/* ================= 3. Resultado y envío ================= */
function resultado() {
  const d = st.done, T = Object.keys(EX.temas);
  app.innerHTML = `<main><div class="card res"><h2>Examen entregado</h2><p>${esc(st.nom)} ${esc(st.ap)} ${esc(st.am)} · ${esc(st.mat)}</p><p class="muted">Tu calificación</p><div class="big">${d.calif.toFixed(1)}</div><p><b>${String(d.aciertos).replace('.', ',')}</b> de ${NPREG} puntos${d.sin ? ` · ${d.sin} sin responder` : ''}</p><p class="msg" id="env"></p></div>
    <div class="card"><h2>Resultado por tema</h2><div class="tbl"><table><tr><th>Tema</th><th>Puntos</th></tr>${T.filter((t) => d.porTema[t]).map((t) => `<tr><td>${t}. ${esc(EX.temas[t])}</td><td>${String(d.porTema[t].p).replace('.', ',')} de ${d.porTema[t].n}</td></tr>`).join('')}</table></div><p class="muted small">Repasa en el simulador los temas con menos puntos.</p></div></main>`;
  estadoEnvio();
}
function estadoEnvio() { const e = $('#env'); if (!e) return;
  if (st.previa) { e.className = 'msg'; e.textContent = 'Vista previa docente: este resultado no se guarda.'; return; }
  if (st.sent) { e.className = 'msg ok'; e.textContent = '✓ Tu calificación quedó registrada con tu maestra.'; return; }
  e.className = 'msg err'; e.innerHTML = 'Enviando tu calificación… <button class="btn" id="reenv" style="margin-left:6px">Reintentar envío</button>';
  $('#reenv').addEventListener('click', enviar); }
let enviando = false;
async function enviar() {
  if (st.previa || st.sent || enviando || !st.done) { estadoEnvio(); return; } enviando = true;
  const d = st.done, T = Object.keys(EX.temas);
  const fila = { materia: EX.materia, matricula: st.mat, paterno: st.ap, materno: st.am, nombre: st.nom, grupo: st.grp, intento: st.intento,
    calif: d.calif, aciertos: d.aciertos, total: NPREG, temas: T.filter((t) => d.porTema[t]).map((t) => `${t} ${d.porTema[t].p}/${d.porTema[t].n}`).join(' · '),
    minutos: Math.round((d.fin - st.inicio) / 6000) / 10, salidas: st.salidas, pegar: st.pegar, sin: d.sin,
    detalle: d.det.map((x) => `${x[0]}:${x[1]}`).join(' '), dev: (navigator.userAgent.match(/Android|iPhone|iPad|Windows|Mac OS X|CrOS|Linux/) || ['?'])[0] };
  try { await fetch(URL_HOJA, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ examen: fila }) }); } catch (e) {}
  /* confirma que llegó a la hoja */
  for (let i = 0; i < 4 && !st.sent; i++) { try { const s = await estado(st.mat); if (s && s.hecho) { st.sent = true; save(); } } catch (e) {} if (!st.sent) await new Promise((r) => setTimeout(r, 1500)); }
  enviando = false; estadoEnvio();
}

/* ---------- cuidado del examen: sin copiar ni pegar, y registro de salidas de la página ---------- */
const enExamen = () => st && !st.done && P;
['copy', 'cut', 'paste', 'drop', 'contextmenu'].forEach((ev) => document.addEventListener(ev, (e) => { if (!enExamen()) return; e.preventDefault(); if (ev !== 'contextmenu') { st.pegar++; save(); toast('✋ En el examen no se puede copiar ni pegar.'); } }, true));
document.addEventListener('visibilitychange', () => { if (!enExamen()) return;
  if (document.visibilityState === 'hidden') { st.salidas++; save(); }
  else if (st.salidas) { const s = $('#sal'); if (s) { s.hidden = false; s.innerHTML = `⚠️ Saliste de la página del examen <b>${st.salidas}</b> ${st.salidas === 1 ? 'vez' : 'veces'}. Queda registrado y tu maestra lo verá.`; } } });
window.addEventListener('beforeunload', (e) => { if (enExamen() && !st.previa) { e.preventDefault(); e.returnValue = ''; } });
window.__EX = { armar, puntos, respondida, get st() { return st; }, get P() { return P; } };
registro();
})();
</script>
