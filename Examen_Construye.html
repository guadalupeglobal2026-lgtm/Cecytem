<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen · Construye aplicaciones web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--vino:#6E1F33;--vino2:#A13546;--oro:#C9A15A;--tinta:#1F2328;--gris:#5A6270;--linea:#D9DDE3;--fondo:#F4F5F7;--ok:#1B7A43;--mal:#B42318;--azul:#1D5FD1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{background:var(--vino);color:#fff;padding:14px 18px}
header h1{margin:0;font-size:1.15rem;font-weight:800}
header p{margin:2px 0 0;opacity:.85;font-size:.85rem}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:20px;margin:0 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{margin:0 0 10px;font-size:1.3rem;color:var(--vino)}
label.f{display:block;margin:0 0 12px}
label.f span{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
input[type=text],input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--linea);border-radius:10px;background:#fff}
input:focus{outline:none;border-color:var(--vino2);box-shadow:0 0 0 3px rgba(161,53,70,.15)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#E7E9ED;color:var(--tinta)}
.btn.p{background:var(--vino);color:#fff}.btn.p:hover{background:var(--vino2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{margin:10px 0 0;font-weight:600}.msg.err{color:var(--mal)}.msg.ok{color:var(--ok)}
ul.reglas{margin:6px 0 0;padding-left:20px}ul.reglas li{margin:4px 0}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--linea);padding:10px 16px}
.top .in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.bar{height:6px;background:#E7E9ED;border-radius:6px;overflow:hidden;margin-top:6px;width:100%}.bar i{display:block;height:100%;background:var(--oro)}
.qn{font-size:.8rem;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.qt{font-size:1.05rem;margin:0 0 14px;user-select:none;-webkit-user-select:none}
.qt b{color:var(--vino)}
pre.code{background:#111827;color:#E5E7EB;padding:12px 14px;border-radius:10px;overflow:auto;font:13.5px/1.5 ui-monospace,Consolas,monospace;margin:10px 0;white-space:pre}
code{background:#EEF0F3;padding:1px 5px;border-radius:5px;font:.9em ui-monospace,Consolas,monospace}
.tbl{overflow:auto;margin:10px 0}table{border-collapse:collapse;font-size:.92rem}th,td{border:1px solid var(--linea);padding:6px 10px;text-align:left}th{background:#F1EDEE}
.doc{background:#FBFAF8;border:1px solid var(--linea);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.opts{display:grid;gap:8px;margin:6px 0 0;user-select:none;-webkit-user-select:none}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--linea);border-radius:10px;padding:11px 12px;cursor:pointer;background:#fff}
.opt:hover{border-color:#B9BEC7}.opt input{margin-top:4px;accent-color:var(--vino)}
.opt.on{border-color:var(--vino);background:#FBF3F5}
.sub{font-weight:800;color:var(--vino);margin:16px 0 4px;font-size:.95rem}
.ans input{max-width:420px}.ans small{display:block;color:var(--gris);margin-top:4px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.mapa button{font:inherit;font-size:.82rem;font-weight:700;border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:7px 0;cursor:pointer}
.mapa button.r{background:#E9F5EE;border-color:#9CD3B1}.mapa button.cur{border-color:var(--vino);box-shadow:0 0 0 2px rgba(110,31,51,.25)}
.aviso{background:#FFF4E5;border:1px solid #F5C26B;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:.92rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:520px;width:100%}
.res{text-align:center}.res .big{font-size:3.6rem;font-weight:800;color:var(--vino);line-height:1;margin:8px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1F2328;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90vw}
.muted{color:var(--gris)}.small{font-size:.85rem}
[hidden]{display:none!important}
</style>
</head>

<header><h1>Examen del segundo parcial · Construye aplicaciones web</h1><p>CECyTEM Plantel Metepec II · Técnico en Programación</p></header>
<div id="app"></div>
<script>
/* Examen del segundo parcial · Construye aplicaciones web (Sistema AquaLink)
   Cada pregunta es una función gen(K) que arma la pregunta con datos distintos para cada alumno.
   Formato que devuelve gen:
     { q, opts: [correcta, ...incorrectas] }                       opción múltiple
     { q, opts: [...], why: [razón correcta, ...incorrectas] }       respuesta + razón (vale 0.5 + 0.5)
     { q, num: valor, tol: tolerancia, unit: 's' }                   respuesta numérica
     { q, txt: [regex...], ph: 'ejemplo de formato' }                escribir un comando o valor  */
(() => {
const c = (t) => `<pre class="code">${String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`;
const k = (t) => `<code>${String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;')}</code>`;
const NOM = ['Ana', 'Luis', 'Sofía', 'Diego', 'Valeria', 'Mateo', 'Camila', 'Iker', 'Regina', 'Emiliano', 'Ximena', 'Santiago', 'Renata', 'Leonardo'];
const r1 = (x) => Math.round(x * 10) / 10;
const rx = (t) => String(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

window.EXAMEN = {
  materia: 'Construye',
  titulo: 'Construye aplicaciones web',
  temas: { A: 'Base de datos y entorno Django', B: 'Servidor local XAMPP y conexión', C: 'Modelos, administración y login', D: 'Pasaporte con QR y asistencia', E: 'Panel deportivo y consultas' },
  preguntas: [
  /* ================= A. Base de datos y entorno Django ================= */
  { t: 'A', gen: (K) => { const s = K.pick([
      ['Cada nadador registra muchos tiempos de nado; cada tiempo es de un solo nadador.', 0],
      ['Un instructor atiende varios horarios y cada horario tiene varios instructores.', 1],
      ['Cada usuario del sistema corresponde a un solo nadador y cada nadador tiene un solo usuario.', 2],
      ['Un nadador se inscribe en varias competencias y en cada competencia participan muchos nadadores.', 1],
      ['Un nadador puede tener varios reportes de incidente; cada reporte es de un nadador.', 0]]);
    const R = ['Uno a muchos (1:N)', 'Muchos a muchos (N:M)', 'Uno a uno (1:1)'];
    const W = ['La llave foránea va en la tabla del lado «muchos».', 'Se necesita una tabla intermedia con dos llaves foráneas.', 'Cada registro de una tabla se une con un solo registro de la otra, por eso en Django se usa OneToOneField.'];
    return { q: `Lee la regla del negocio de AquaLink: <b>«${s[0]}»</b><br>¿Qué tipo de relación es y por qué?`, opts: [R[s[1]], ...R.filter((x, i) => i !== s[1])], why: [W[s[1]], ...W.filter((x, i) => i !== s[1])] }; } },
  { t: 'A', gen: (K) => { const [p, h] = K.pick([['instructor', 'clase'], ['horario', 'asistencia'], ['nadador', 'tiempo'], ['carril', 'entrenamiento']]);
    return { q: `Un <b>${p}</b> tiene muchos registros de <b>${h}</b>, y cada ${h} pertenece a un solo ${p}. ¿Dónde colocas la llave foránea?`, opts: [`En la tabla ${h}, como ${p}_id`, `En la tabla ${p}, como ${h}_id`, 'En las dos tablas, una en cada una', `En una tabla intermedia ${p}_${h}`] }; } },
  { t: 'A', gen: (K) => { const [a, b] = K.pick([['nadador', 'horario'], ['instructor', 'horario'], ['nadador', 'competencia'], ['nadador', 'taller']]);
    return { q: `En AquaLink, un ${a} se relaciona con muchos ${b}s y cada ${b} con muchos ${a}s. Un compañero propone guardar en la tabla ${a} un campo de texto con los id: «3,7,12». ¿Qué le respondes?`, opts: [`Que conviene una tabla intermedia con ${a}_id y ${b}_id, porque así MySQL puede validar cada relación con llaves foráneas`, 'Que está bien, porque ocupa menos espacio', `Que mejor repita la tabla ${b} dentro de ${a}`, 'Que las relaciones muchos a muchos no se pueden guardar en MySQL'] }; } },
  { t: 'A', gen: (K) => { const f = K.pick([
      ['el tiempo de una prueba, por ejemplo 44.37 segundos', 'DECIMAL', 'Guarda decimales exactos, sin redondeos inesperados.'],
      ['la fecha de un registro de asistencia', 'DATE', 'Permite comparar y ordenar fechas, por ejemplo «asistencias de hoy».'],
      ['el número de carril (1 a 8)', 'INT', 'Es un número entero con el que se puede calcular y comparar.'],
      ['el nombre completo del nadador', 'VARCHAR', 'Es texto de longitud variable.']]);
    const T = ['DECIMAL', 'DATE', 'INT', 'VARCHAR'], Wy = ['Guarda decimales exactos, sin redondeos inesperados.', 'Permite comparar y ordenar fechas, por ejemplo «asistencias de hoy».', 'Es un número entero con el que se puede calcular y comparar.', 'Es texto de longitud variable.'];
    return { q: `¿Qué tipo de dato de MySQL eliges para <b>${f[0]}</b> y por qué?`, opts: [f[1], ...T.filter((x) => x !== f[1])], why: [f[2], ...Wy.filter((x) => x !== f[2])] }; } },
  { t: 'A', gen: (K) => { const n = K.int(40, 99), m = K.int(8, 30);
    return { q: `La tabla nadador tiene ${m} registros (id del 1 al ${m}). Alguien ejecuta:${c(`INSERT INTO asistencia (nadador_id, fecha)\nVALUES (${n}, '2026-10-12');`)}¿Qué pasa?`, opts: ['MySQL rechaza el registro porque viola la llave foránea: no existe ese nadador', 'Se guarda sin problema', `MySQL crea automáticamente al nadador ${n}`, 'Se borra la tabla asistencia'] }; } },
  { t: 'A', gen: (K) => { const h = K.pick(['asistencia', 'tiempo', 'incidente']);
    return { q: `Al importar este script, MySQL marca un error en la primera tabla:${c(`CREATE TABLE ${h} (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    nadador_id INT NOT NULL,\n    FOREIGN KEY (nadador_id) REFERENCES nadador(id)\n);\nCREATE TABLE nadador (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    nombre VARCHAR(100) NOT NULL\n);`)}¿Cuál es la causa?`, opts: [`La tabla ${h} se crea antes que nadador, a la que hace referencia`, 'Falta poner DATE en nadador_id', 'No se puede usar AUTO_INCREMENT dos veces', `El nombre ${h} está reservado por MySQL`] }; } },
  { t: 'A', gen: (K) => { const v = K.pick(['venv', 'entorno', 'env', 'mi_entorno']);
    return { q: `En la terminal de VS Code (Windows), escribe el comando que crea un entorno virtual llamado <b>${v}</b>.`, txt: [new RegExp(`^(python3?|py) -m venv ${v}$`, 'i')], sol: `python -m venv ${v}`, ph: 'Escribe el comando completo' }; } },
  { t: 'A', gen: (K) => { const p = K.pick(['aqualink', 'natacion', 'alberca']);
    return { q: `Tu compañero escribió ${k(`django-admin startproject ${p}`)} sin el punto final. ¿Qué pasó en la carpeta?`, opts: [`Se creó una carpeta ${p} extra y manage.py quedó dentro de ella, no en la carpeta actual`, 'No pasó nada diferente: el punto es opcional', 'Se borró la carpeta actual', 'Django marcó error y no creó nada'] }; } },
  { t: 'A', gen: (K) => { const app = K.pick(['nadadores', 'asistencias', 'entrenamientos']);
    return { q: `Creaste la app <b>${app}</b> y escribiste sus modelos, pero ${k('python manage.py makemigrations')} responde «No changes detected». ¿Qué falta?`, opts: [`Registrar '${app}' en INSTALLED_APPS de settings.py`, 'Instalar otra vez Django', 'Encender Apache en XAMPP', `Escribir la app en urls.py`] }; } },
  { t: 'A', gen: (K) => ({ q: 'Instalaste Django antes de activar el entorno virtual. Después activas el entorno y al ejecutar manage.py aparece <b>«No module named django»</b>. ¿Qué pasó y por qué?', opts: ['Django quedó instalado fuera del entorno; hay que instalarlo con el entorno activo', 'El proyecto está dañado y hay que borrarlo', 'Falta encender MySQL', 'Hay que reiniciar la computadora'], why: ['Cada entorno virtual tiene sus propias librerías, separadas de las del sistema.', 'Django solo funciona con internet.', 'manage.py necesita a MySQL para importar Django.', 'Python guarda los módulos en la memoria RAM.'] }) },

  /* ================= B. Servidor local XAMPP y conexión ================= */
  { t: 'B', gen: (K) => ({ q: 'Al presionar Start en MySQL, el panel de XAMPP muestra: <b>«Port 3306 in use by another application»</b>. ¿Qué haces?', opts: ['Detener el otro servicio de MySQL que ocupa el puerto (o cambiar el puerto) y volver a iniciar', 'Reinstalar Django', 'Abrir phpMyAdmin aunque MySQL esté apagado', 'Cambiar el puerto de Apache a 3306'] }) },
  { t: 'B', gen: (K) => { const p = K.pick(['80', '8000']);
    return { q: `En settings.py alguien escribió ${k(`'PORT': '${p}',`)} en DATABASES. MySQL de XAMPP está encendido. ¿Qué pasa y por qué?`, opts: ['Django no logra conectarse a MySQL', 'Funciona igual que con cualquier puerto', 'Se borra la base de datos', 'phpMyAdmin deja de abrir'], why: [`MySQL escucha en el puerto 3306; el ${p} es de ${p === '80' ? 'Apache' : 'runserver'}.`, 'Django prueba todos los puertos hasta encontrar MySQL.', 'El puerto solo cambia la velocidad de la conexión.', 'El puerto solo importa al importar el .sql.'] }; } },
  { t: 'B', gen: (K) => { const pasos = ['Iniciar Apache y MySQL en el panel de XAMPP', 'Abrir http://localhost/phpmyadmin', 'Crear la base de datos aqualink', 'Seleccionar la base y abrir la pestaña Importar', 'Elegir aqualink.sql y dar clic en Importar', 'Verificar que aparezcan las tablas'];
    const i = K.int(1, 4); const lista = pasos.filter((x, j) => j !== i);
    return { q: `Un compañero escribió estos pasos para dejar lista la base, pero le falta uno:<ol>${lista.map((x) => `<li>${x}</li>`).join('')}</ol>¿Cuál falta?`, opts: [pasos[i], 'Instalar Postman', 'Ejecutar python manage.py runserver', 'Crear el superusuario'] }; } },
  { t: 'B', gen: (K) => { const t = K.pick(['nadador', 'asistencia', 'tiempo']);
    return { q: `Al importar aqualink.sql por segunda vez, phpMyAdmin dice: <b>«#1050 - Table '${t}' already exists»</b>. ¿Qué es lo más razonable?`, opts: ['Revisar si el script ya se había importado y, si se necesita repetir, borrar o vaciar las tablas antes de importar', 'Importar el archivo varias veces hasta que funcione', 'Cambiar la extensión del archivo a .txt', 'Apagar XAMPP y dejarlo así'] }; } },
  { t: 'B', gen: (K) => ({ q: `Escribe el valor exacto que va en ${k("'ENGINE'")} de DATABASES para que Django use MySQL.`, txt: [/^'?django\.db\.backends\.mysql'?,?$/i], sol: 'django.db.backends.mysql', ph: 'django.db.backends.…' }) },
  { t: 'B', gen: (K) => { const E = [["Can't connect to MySQL server on 'localhost' (10061)", 0], ['Error loading MySQLdb module. Did you install mysqlclient?', 1], ["Access denied for user 'root'@'localhost' (using password: YES)", 2], [`Unknown database '${K.pick(['aqualinkk', 'aqualnk', 'aqua_link'])}'`, 3]];
    const C = ['MySQL está apagado en XAMPP', 'Falta instalar el conector mysqlclient', 'Usuario o contraseña incorrectos en DATABASES', 'El nombre de la base no coincide con el de phpMyAdmin'];
    const e = K.pick(E); return { q: `Al ejecutar runserver aparece:${c(e[0])}¿Cuál es la causa?`, opts: [C[e[1]], ...C.filter((x, i) => i !== e[1])] }; } },
  { t: 'B', gen: (K) => { const E = [["Can't connect to MySQL server: Connection refused", 0], ["Access denied for user 'admin'@'localhost'", 2], ['Error loading MySQLdb module', 1]];
    const S = ['Iniciar MySQL en el panel de XAMPP', 'Ejecutar pip install mysqlclient con el entorno activo', "Usar 'USER': 'root' y 'PASSWORD': '' como en XAMPP"];
    const e = K.pick(E); return { q: `Tu equipo ve este mensaje:${c(e[0])}¿Qué solución aplicas primero?`, opts: [S[e[1]], ...S.filter((x, i) => i !== e[1]), 'Borrar la carpeta del proyecto'] }; } },
  { t: 'B', gen: (K) => ({ q: 'Con el entorno virtual activo, escribe el comando que instala el conector de MySQL para Python que usa Django.', txt: [/^(python -m )?pip3? install mysqlclient$/i], sol: 'pip install mysqlclient', ph: 'Escribe el comando completo' }) },
  { t: 'B', gen: (K) => { const db = K.pick(['aqualink', 'aqualink_db', 'natacion']), mal = db + K.pick(['s', '1', '_2026']);
    return { q: `En phpMyAdmin la base se llama <b>${db}</b>. En settings.py está ${k(`'NAME': '${mal}',`)}. ¿Qué mensaje esperas al ejecutar migrate?`, opts: [`Unknown database '${mal}'`, "Access denied for user 'root'@'localhost'", 'Error loading MySQLdb module', 'Las migraciones se aplican sin error'] }; } },
  { t: 'B', gen: (K) => ({ q: "En XAMPP el usuario root no tiene contraseña. Un compañero escribió <code>'PASSWORD': 'root'</code> y aparece «Access denied … (using password: YES)». ¿Qué corriges y por qué?", opts: ["Dejar 'PASSWORD': ''", "Cambiar 'USER' a 'admin'", 'Reinstalar MySQL', "Cambiar 'HOST' a 'google.com'"], why: ['«using password: YES» indica que Django envió una contraseña que no coincide con la de MySQL.', 'El usuario root solo funciona en Linux.', 'El mensaje indica que MySQL está apagado.', 'El error es del navegador, no de MySQL.'] }) },

  /* ================= C. Modelos, administración y login ================= */
  { t: 'C', gen: (K) => { const f = K.pick([
      ['muchos tiempos pertenecen a un nadador', 'ForeignKey'], ['cada nadador tiene exactamente un usuario para iniciar sesión', 'OneToOneField'],
      ['la fecha de nacimiento', 'DateField'], ['los segundos de una prueba con dos decimales', 'DecimalField']]);
    const T = ['ForeignKey', 'OneToOneField', 'DateField', 'DecimalField', 'CharField'];
    return { q: `En models.py, ¿qué tipo de campo usas para: <b>${f[0]}</b>?`, opts: [f[1], ...T.filter((x) => x !== f[1]).slice(0, 3)] }; } },
  { t: 'C', gen: (K) => ({ q: `Al ejecutar makemigrations aparece un error con este modelo:${c("class Tiempo(models.Model):\n    nadador = models.ForeignKey(Nadador)\n    segundos = models.DecimalField(max_digits=6, decimal_places=2)")}¿Qué falta?`, opts: ['on_delete en la ForeignKey, por ejemplo on_delete=models.CASCADE', 'max_length en DecimalField', 'Un campo id escrito a mano', 'Importar Tiempo en settings.py'] }) },
  { t: 'C', gen: (K) => { const f = K.pick(['telefono', 'categoria', 'carril']);
    return { q: `Agregaste el campo <b>${f}</b> al modelo Nadador. Al abrir la lista aparece «Unknown column 'nadadores_nadador.${f}'». ¿Qué te faltó y por qué?`, opts: ['Ejecutar makemigrations y después migrate', 'Ejecutar solo runserver otra vez', 'Agregar la columna escribiéndola en el HTML', 'Reiniciar el navegador'], why: ['makemigrations crea el plan del cambio y migrate lo aplica en la tabla de MySQL.', 'runserver crea las columnas nuevas al reiniciar.', 'Las columnas se crean desde la plantilla.', 'El navegador guarda las tablas en caché.'] }; } },
  { t: 'C', gen: (K) => { const n = K.int(1, 9);
    return { q: `En /admin/ la lista de nadadores se ve así: «Nadador object (${n})», «Nadador object (${n + 1})»… ¿Qué agregas al modelo?`, opts: ['Un método __str__ que regrese self.nombre', 'list_filter en admin.py', 'Otro migrate', 'Un campo id'] }; } },
  { t: 'C', gen: (K) => { const r = K.pick([['buscar nadadores escribiendo su nombre', 'search_fields'], ['filtrar la lista por nivel', 'list_filter'], ['ver en columnas el nombre, el nivel y la fecha de nacimiento', 'list_display']]);
    const O = ['search_fields', 'list_filter', 'list_display', 'ordering'];
    return { q: `El encargado de la alberca quiere, en el panel de administración, <b>${r[0]}</b>. ¿Qué opción agregas en NadadorAdmin?`, opts: [r[1], ...O.filter((x) => x !== r[1])] }; } },
  { t: 'C', gen: (K) => ({ q: 'Escribe el comando que crea el usuario administrador para entrar a /admin/.', txt: [/^(python3?|py) manage\.py createsuperuser$/i], sol: 'python manage.py createsuperuser', ph: 'Escribe el comando completo' }) },
  { t: 'C', gen: (K) => { const r = K.pick(['/perfil/', '/panel/', '/pasaporte/']);
    return { q: `La vista de ${r} tiene ${k('@login_required')}. Un visitante sin sesión escribe esa dirección en el navegador. ¿Qué pasa?`, opts: ['Lo redirige a la página de inicio de sesión (código 302)', 'Ve los datos del primer nadador', 'Aparece un error 500', 'Ve la página en blanco con código 200'] }; } },

    <li>Si se cierra la página por accidente, vuelve a abrirla en el mismo dispositivo y escribe tu misma matrícula: tus respuestas se conservan.</li></ul></div>
    <div class="card"><h2>Tus datos</h2>
    <label class="f"><span>Número de matrícula o de control</span><input type="text" id="mat" autocomplete="off" inputmode="text" maxlength="20"></label>
    <div class="grid2"><label class="f"><span>Apellido paterno</span><input type="text" id="ap" autocomplete="off" maxlength="40"></label>
    <label class="f"><span>Apellido materno</span><input type="text" id="am" autocomplete="off" maxlength="40"></label></div>
    <div class="grid2"><label class="f"><span>Nombre(s)</span><input type="text" id="nom" autocomplete="off" maxlength="60"></label>
    <label class="f"><span>Grupo</span><input type="text" id="grp" value="502" autocomplete="off" maxlength="8"></label></div>
    <div class="row"><button class="btn p" id="go">Comenzar examen</button></div><p class="msg err" id="rmsg">${msg ? esc(msg) : ''}</p></div></main>`;
  $('#mat').focus();
  $('#go').addEventListener('click', async () => {
    const mat = normM($('#mat').value), ap = normA($('#ap').value), am = normA($('#am').value), nom = normA($('#nom').value), grp = normM($('#grp').value) || '502';
    const m = $('#rmsg');
    if (mat.length < 4) { m.textContent = 'Escribe tu número de matrícula o de control completo.'; return; }
    if (mat === 'DOCENTE') { docente(); return; }
    if (!ap || !am || !nom) { m.textContent = 'Escribe tu nombre y tus dos apellidos.'; return; }
    m.className = 'msg'; m.textContent = 'Revisando con la hoja de tu maestra…'; $('#go').disabled = true;
    let s; try { s = await estado(mat); } catch (e) { s = null; }
    $('#go').disabled = false; m.className = 'msg err';
    if (!s || !s.ok) { m.textContent = 'No hay conexión con la hoja de tu maestra. Revisa tu internet y vuelve a intentarlo.'; return; }
    const prev = load(mat);
    if (s.hecho) { if (prev && prev.done) { st = prev; resultado(); return; } m.textContent = `Ya presentaste este examen con la matrícula ${mat}. Calificación registrada: ${s.calif}. Si es un error, avisa a tu maestra.`; return; }
    if (prev && prev.done && prev.intento > (s.anulados || 0)) { st = prev; resultado(); enviar(); return; } /* se entregó pero aún no llega a la hoja: se reenvía */
    if (!s.abierto && !(prev && !prev.done && prev.intento > (s.anulados || 0))) { m.textContent = 'El examen todavía no está abierto. Espera la indicación de tu maestra.'; return; }
    if (prev && !prev.done && prev.intento > (s.anulados || 0)) { st = prev; } /* continúa donde se quedó */
    else st = { mat, ap, am, nom, grp, intento: (s.anulados || 0) + 1, inicio: Date.now(), ans: {}, cur: 0, salidas: 0, pegar: 0, done: null };
    save(); examen();
  });
}
/* vista previa para la maestra (no se guarda en la hoja) */
function docente() {
  const m = $('#rmsg'); m.className = 'msg';
  m.innerHTML = 'Vista previa docente: escribe tu contraseña. <input type="password" id="dclave" style="max-width:220px;margin-top:6px"> <button class="btn p" id="dgo">Ver examen</button>';
  $('#dgo').addEventListener('click', async () => { const cl = $('#dclave').value; let d = null; try { d = await getJSON(`accion=checkclave&clave=${encodeURIComponent(cl)}`); } catch (e) {}
    if (!d || !d.checked) { m.className = 'msg err'; m.textContent = 'No se pudo comprobar la contraseña (revisa internet o que el Apps Script esté actualizado).'; return; }
    if (d.sin) { m.className = 'msg err'; m.textContent = 'Todavía no hay contraseña docente. Créala en el simulador con el botón 🔒 Docente y vuelve a intentarlo.'; return; }
    if (!d.ok) { m.className = 'msg err'; m.textContent = 'Contraseña incorrecta.'; return; }
    st = { mat: 'DOCENTE-' + Math.floor(Math.random() * 1e6), ap: 'VISTA', am: 'PREVIA', nom: 'DOCENTE', grp: '-', intento: 1, inicio: Date.now(), ans: {}, cur: 0, salidas: 0, pegar: 0, done: null, previa: true };
    examen(); });
}

/* ================= 2. Examen ================= */
let P = null;
function examen() {
  P = armar(st);
  app.innerHTML = `<div class="top"><div class="in"><span><b>${esc(st.nom)} ${esc(st.ap)} ${esc(st.am)}</b> · ${esc(st.mat)}${st.previa ? ' · <b style="color:var(--mal)">VISTA PREVIA DOCENTE: no se guarda</b>' : ''}</span><span id="cnt"></span><div class="bar"><i id="barra"></i></div></div></div>
    <main><div class="aviso" id="sal" hidden></div><div class="card" id="q"></div>
    <div class="card"><p class="qn">Mapa de preguntas</p><div class="mapa" id="mapa"></div>
    <div class="row" style="margin-top:14px"><button class="btn p" id="entregar">Entregar examen</button><span class="muted small">Revisa que hayas contestado todo antes de entregar.</span></div></div></main>`;
  pinta(); $('#entregar').addEventListener('click', confirmar);
}
const cuenta = () => P.filter((p) => respondida(p, st.ans[p.i])).length;
function pinta() {
  const k = st.cur, p = P[k], a = st.ans[p.i] || {};
  let h = `<p class="qn">Pregunta ${k + 1} de ${NPREG} · ${esc(EX.temas[p.t])}</p><div class="qt">${p.q}</div>`;
  if (p.tipo === 'mc' || p.tipo === 'mr') {
    if (p.tipo === 'mr') h += '<p class="sub">Tu respuesta:</p>';
    h += `<div class="opts">${p.ord.map((j) => `<label class="opt${a.o === j ? ' on' : ''}"><input type="radio" name="o" value="${j}" ${a.o === j ? 'checked' : ''}><span>${esc(p.opts[j])}</span></label>`).join('')}</div>`;
    if (p.tipo === 'mr') h += `<p class="sub">¿Por qué?</p><div class="opts">${p.word.map((j) => `<label class="opt${a.w === j ? ' on' : ''}"><input type="radio" name="w" value="${j}" ${a.w === j ? 'checked' : ''}><span>${esc(p.why[j])}</span></label>`).join('')}</div><p class="muted small">Vale medio punto la respuesta y medio punto la razón.</p>`;
  } else {
    h += `<div class="ans"><input type="text" id="v" value="${esc(a.v || '')}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(p.tipo === 'num' ? 'Escribe solo el número' : p.ph)}" ${p.tipo === 'num' ? 'inputmode="decimal"' : ''}>${p.tipo === 'num' && p.unit ? ` <b>${esc(p.unit)}</b>` : ''}<small>${p.tipo === 'num' ? 'Escribe el resultado; usa punto decimal si hace falta.' : 'Escríbelo tal como lo teclearías en la terminal o en el código.'}</small></div>`;
  }
  h += `<div class="nav"><button class="btn" id="ant" ${k === 0 ? 'disabled' : ''}>← Anterior</button><button class="btn p" id="sig">${k === NPREG - 1 ? 'Ir a entregar' : 'Siguiente →'}</button></div>`;
  $('#q').innerHTML = h;
  $('#q').querySelectorAll('input[type=radio]').forEach((r) => r.addEventListener('change', () => { const x = st.ans[p.i] = st.ans[p.i] || {}; x[r.name] = +r.value; save(); pinta(); }));
  const v = $('#v'); if (v) { v.addEventListener('input', () => { (st.ans[p.i] = st.ans[p.i] || {}).v = v.value.slice(0, 200); save(); barra(); }); v.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#sig').click(); }); }
  $('#ant').addEventListener('click', () => { st.cur--; save(); pinta(); window.scrollTo(0, 0); });
  $('#sig').addEventListener('click', () => { if (k === NPREG - 1) { $('#entregar').scrollIntoView({ behavior: 'smooth' }); return; } st.cur++; save(); pinta(); window.scrollTo(0, 0); });
  $('#mapa').innerHTML = P.map((x, j) => `<button class="${respondida(x, st.ans[x.i]) ? 'r' : ''}${j === k ? ' cur' : ''}" data-j="${j}">${j + 1}</button>`).join('');
  $('#mapa').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { st.cur = +b.dataset.j; save(); pinta(); window.scrollTo(0, 0); }));
  barra();
}
function barra() { const n = cuenta(); $('#cnt').textContent = `Respondidas: ${n} de ${NPREG}`; $('#barra').style.width = `${n / NPREG * 100}%`;
  const b = $(`#mapa button[data-j="${st.cur}"]`); if (b) b.classList.toggle('r', respondida(P[st.cur], st.ans[P[st.cur].i])); }
function confirmar() {
  const falt = P.map((p, j) => (respondida(p, st.ans[p.i]) ? 0 : j + 1)).filter(Boolean);
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="card"><h2>¿Entregar el examen?</h2>${falt.length ? `<p>Te faltan <b>${falt.length}</b> pregunta(s): ${falt.slice(0, 20).join(', ')}${falt.length > 20 ? '…' : ''}. Las preguntas sin responder cuentan como incorrectas.</p>` : '<p>Respondiste todas las preguntas.</p>'}<p><b>Ya no podrás cambiar tus respuestas.</b></p><div class="row"><button class="btn p" id="si">Sí, entregar</button><button class="btn" id="no">Seguir revisando</button></div></div>`;
  document.body.appendChild(d); $('#no', d).addEventListener('click', () => d.remove());
  $('#si', d).addEventListener('click', () => { d.remove(); calificar(); });
}
function calificar() {
  const porTema = {}; let tot = 0, sin = 0; const det = [];
  P.forEach((p) => { const pt = puntos(p, st.ans[p.i]); tot += pt; if (!respondida(p, st.ans[p.i])) sin++;
    const t = porTema[p.t] = porTema[p.t] || { p: 0, n: 0 }; t.p += pt; t.n++; det.push([p.i + 1, pt]); });
  det.sort((a, b) => a[0] - b[0]);
  const calif = Math.round(tot / NPREG * 100) / 10;
  st.done = { calif, aciertos: tot, porTema, sin, det, fin: Date.now() }; save(); resultado(); enviar();
}

/* ================= 3. Resultado y envío ================= */
function resultado() {
  const d = st.done, T = Object.keys(EX.temas);
  app.innerHTML = `<main><div class="card res"><h2>Examen entregado</h2><p>${esc(st.nom)} ${esc(st.ap)} ${esc(st.am)} · ${esc(st.mat)}</p><p class="muted">Tu calificación</p><div class="big">${d.calif.toFixed(1)}</div><p><b>${String(d.aciertos).replace('.', ',')}</b> de ${NPREG} puntos${d.sin ? ` · ${d.sin} sin responder` : ''}</p><p class="msg" id="env"></p></div>
    <div class="card"><h2>Resultado por tema</h2><div class="tbl"><table><tr><th>Tema</th><th>Puntos</th></tr>${T.filter((t) => d.porTema[t]).map((t) => `<tr><td>${t}. ${esc(EX.temas[t])}</td><td>${String(d.porTema[t].p).replace('.', ',')} de ${d.porTema[t].n}</td></tr>`).join('')}</table></div><p class="muted small">Repasa en el simulador los temas con menos puntos.</p></div></main>`;
  estadoEnvio();
}
function estadoEnvio() { const e = $('#env'); if (!e) return;
  if (st.previa) { e.className = 'msg'; e.textContent = 'Vista previa docente: este resultado no se guarda.'; return; }
  if (st.sent) { e.className = 'msg ok'; e.textContent = '✓ Tu calificación quedó registrada con tu maestra.'; return; }
  e.className = 'msg err'; e.innerHTML = 'Enviando tu calificación… <button class="btn" id="reenv" style="margin-left:6px">Reintentar envío</button>';
  $('#reenv').addEventListener('click', enviar); }
let enviando = false;
async function enviar() {
  if (st.previa || st.sent || enviando || !st.done) { estadoEnvio(); return; } enviando = true;
  const d = st.done, T = Object.keys(EX.temas);
  const fila = { materia: EX.materia, matricula: st.mat, paterno: st.ap, materno: st.am, nombre: st.nom, grupo: st.grp, intento: st.intento,
    calif: d.calif, aciertos: d.aciertos, total: NPREG, temas: T.filter((t) => d.porTema[t]).map((t) => `${t} ${d.porTema[t].p}/${d.porTema[t].n}`).join(' · '),
    minutos: Math.round((d.fin - st.inicio) / 6000) / 10, salidas: st.salidas, pegar: st.pegar, sin: d.sin,
    detalle: d.det.map((x) => `${x[0]}:${x[1]}`).join(' '), dev: (navigator.userAgent.match(/Android|iPhone|iPad|Windows|Mac OS X|CrOS|Linux/) || ['?'])[0] };
  try { await fetch(URL_HOJA, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ examen: fila }) }); } catch (e) {}
  /* confirma que llegó a la hoja */
  for (let i = 0; i < 4 && !st.sent; i++) { try { const s = await estado(st.mat); if (s && s.hecho) { st.sent = true; save(); } } catch (e) {} if (!st.sent) await new Promise((r) => setTimeout(r, 1500)); }
  enviando = false; estadoEnvio();
}

/* ---------- cuidado del examen: sin copiar ni pegar, y registro de salidas de la página ---------- */
const enExamen = () => st && !st.done && P;
['copy', 'cut', 'paste', 'drop', 'contextmenu'].forEach((ev) => document.addEventListener(ev, (e) => { if (!enExamen()) return; e.preventDefault(); if (ev !== 'contextmenu') { st.pegar++; save(); toast('✋ En el examen no se puede copiar ni pegar.'); } }, true));
document.addEventListener('visibilitychange', () => { if (!enExamen()) return;
  if (document.visibilityState === 'hidden') { st.salidas++; save(); }
  else if (st.salidas) { const s = $('#sal'); if (s) { s.hidden = false; s.innerHTML = `⚠️ Saliste de la página del examen <b>${st.salidas}</b> ${st.salidas === 1 ? 'vez' : 'veces'}. Queda registrado y tu maestra lo verá.`; } } });
window.addEventListener('beforeunload', (e) => { if (enExamen() && !st.previa) { e.preventDefault(); e.returnValue = ''; } });
window.__EX = { armar, puntos, respondida, get st() { return st; }, get P() { return P; } };
registro();
})();
</script>
